apiVersion: v1
kind: Namespace
metadata:
  name: blueeconomy-sandbox
  labels:
    kubernetes.io/metadata.name: blueeconomy-sandbox
    blueeconomy.platform/workstream: sandbox
    environment: sandbox
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress-egress
  namespace: blueeconomy-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
