apiVersion: v2
name: geo-service
description: >-
  blueeconomy-geo-service: the sovereign vessel-tracking hot path
  (GEO_ARCHITECTURE §2). AIS/tracker/app-report ingestion, signed
  RFC 8785 JCS + JWS-EdDSA envelopes, Kafka bus, PostGIS store, geofence
  evaluation and the /v1/geo REST API. Fail-closed: digest-pinned image,
  all credentials via ExternalSecrets (signing keys, Kafka/Redis/PG DSNs),
  exactly one signing env-var convention per docs/signing-config.md,
  GEO_TEST_* env refused in the prod profile, resources required,
  PodSecurity restricted. Cloud-agnostic: no provider API is consumed.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - geospatial
  - vessel-tracking
  - ais
  - blue-economy
annotations:
  blueeconomy.platform/criticality: "geo-hot-path"
  blueeconomy.platform/upstream-policy: "Pin verified upstream image digests; do not deploy unreviewed defaults"
