# geo-service network posture: ingress from the APISIX edge namespace only
# (plus Prometheus scraping); egress to PostGIS 5432, Kafka 9092, Redis 6379
# and DNS. Mirrored at the eBPF layer by charts/cilium networkPolicies.geo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "geo-service.fullname" . }}
  labels:
    {{- include "geo-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "geo-service.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.apisixNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: blueeconomy-platform
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.postgisNamespace | quote }}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.kafkaNamespace | quote }}
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.redisNamespace | quote }}
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
