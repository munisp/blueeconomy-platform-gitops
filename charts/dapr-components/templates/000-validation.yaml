{{- $ws := required "workstream.name is required (ports | ferries | cvff | seafarer | fisheries | isr)" .Values.workstream.name -}}
{{- if not (has $ws (list "ports" "ferries" "cvff" "seafarer" "fisheries" "isr")) -}}
{{- fail "workstream.name must be one of: ports, ferries, cvff, seafarer, fisheries, isr" -}}
{{- end -}}
{{- if empty .Values.workstream.appIds -}}
{{- fail "workstream.appIds must list the approved Dapr app-ids for this workstream" -}}
{{- end -}}
{{- /* Scope segregation: every workstream release is hard-restricted to its
       own approved Dapr app-ids, regardless of supplied environment values.
       cvff: fiduciary segregation. isr: national-security segregation. */ -}}
{{- $approvedAppIds := dict
  "ports" (list "port-interoperability-api" "ussd-gateway" "booking-worker" "ports-outbox-publisher")
  "ferries" (list "ferry-api" "ferry-worker" "ferry-outbox-publisher")
  "cvff" (list "intent-api" "cvff-worker" "cvff-outbox-publisher")
  "seafarer" (list "credential-verification-api" "seafarer-credential-worker")
  "fisheries" (list "trace-api" "trace-worker" "fisheries-outbox-publisher")
  "isr" (list "maritime-intelligence-api" "isr-worker" "isr-outbox-publisher")
-}}
{{- $allowed := index $approvedAppIds $ws -}}
{{- $article := ternary "an" "a" (eq $ws "isr") -}}
{{- range $appId := .Values.workstream.appIds -}}
{{- if not (has $appId $allowed) -}}
{{- fail (printf "workstream.appIds entry %q is not %s %s app-id; %s components are restricted to %s" $appId $article $ws $ws (join ", " $allowed)) -}}
{{- end -}}
{{- end -}}
{{- $store := required "externalSecrets.storeRef.name is required" .Values.externalSecrets.storeRef.name -}}
{{- if .Values.pubsub.enabled -}}
{{- if eq .Values.pubsub.driver "kafka" -}}
{{- $brokers := required "pubsub.kafka.brokers is required" .Values.pubsub.kafka.brokers -}}
{{- if eq .Values.pubsub.kafka.authType "sasl" -}}
{{- $n := required "pubsub.kafka.saslPasswordSecretKeyRef.name is required when authType=sasl" .Values.pubsub.kafka.saslPasswordSecretKeyRef.name -}}
{{- end -}}
{{- else if eq .Values.pubsub.driver "fluvio" -}}
{{- $broker := required "pubsub.fluvio.broker is required when pubsub.driver=fluvio" .Values.pubsub.fluvio.broker -}}
{{- else -}}
{{- fail "pubsub.driver must be kafka or fluvio" -}}
{{- end -}}
{{- end -}}
{{- if .Values.state.hot.enabled -}}
{{- $host := required "state.hot.redisHost is required" .Values.state.hot.redisHost -}}
{{- $n := required "state.hot.passwordSecretKeyRef.name is required" .Values.state.hot.passwordSecretKeyRef.name -}}
{{- $k := required "state.hot.passwordSecretKeyRef.key is required" .Values.state.hot.passwordSecretKeyRef.key -}}
{{- end -}}
{{- if .Values.state.durable.enabled -}}
{{- $n := required "state.durable.connectionStringSecretKeyRef.name is required" .Values.state.durable.connectionStringSecretKeyRef.name -}}
{{- $k := required "state.durable.connectionStringSecretKeyRef.key is required" .Values.state.durable.connectionStringSecretKeyRef.key -}}
{{- end -}}
{{- if .Values.secretStores.azureKeyVault.enabled -}}
{{- $vault := required "secretStores.azureKeyVault.vaultName is required" .Values.secretStores.azureKeyVault.vaultName -}}
{{- end -}}
