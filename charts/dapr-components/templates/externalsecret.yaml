{{- if .Values.externalSecrets.keys }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "dapr-components.secretName" . }}
  labels:
    {{- include "dapr-components.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.storeRef.name is required" .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ include "dapr-components.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $key, $remoteKey := .Values.externalSecrets.keys }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ $remoteKey | quote }}
    {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
# Least-privilege read of only the synced component secret, for workloads
# (e.g. Dapr sidecar bootstrap via secretstores.kubernetes) that must resolve
# component secretKeyRefs without broad secret access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dapr-components.secretName" . }}-reader
  labels:
    {{- include "dapr-components.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "dapr-components.secretName" . | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dapr-components.secretName" . }}-reader
  labels:
    {{- include "dapr-components.labels" . | nindent 4 }}
subjects:
  - kind: Group
    name: system:serviceaccounts:{{ .Release.Namespace }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dapr-components.secretName" . }}-reader
{{- end }}
