apiVersion: v2
name: opa-policies
description: >-
  Reconciled OPA policy layer promoted from the umbrella seed kustomize:
  the platform policy packs (cvff four-party SoD, admin tenant scoping,
  clearance classification gating, plus the APISIX edge hook policy) carried
  in immutable ConfigMaps, the OPA server consuming them, the APISIX opa
  plugin hook contract, and the producer-signature key directory (Ed25519
  public keys for every platform event producer) consumed by
  security-operations and data-platform via KEY_DIRECTORY_PATH volume mount.
  Fail-closed: no public key material is defaulted.
type: application
version: 0.1.0
appVersion: "0.70.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - opa
  - rego
  - policy
  - event-signatures
  - blue-economy
annotations:
  blueeconomy.platform/criticality: "edge-authorization-and-event-integrity"
  blueeconomy.platform/upstream-policy: "Pin verified upstream image digests; do not deploy unreviewed defaults"
