apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  labels:
    {{- include "opa-policies.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.opa.replicas }}
  selector:
    matchLabels:
      {{- include "opa-policies.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opa-policies.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: opa
          image: "{{ .Values.opa.image.repository }}@{{ .Values.opa.image.digest }}"
          imagePullPolicy: {{ .Values.opa.image.pullPolicy }}
          args: ["run", "--server", "--addr=:8181", "/policies"]
          ports:
            - containerPort: 8181
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.opa.resources | nindent 12 }}
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
      volumes:
        - name: policies
          configMap:
            name: {{ include "opa-policies.fullname" . }}-bundle
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opa-policies.serviceName" . }}
  labels:
    {{- include "opa-policies.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "opa-policies.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.apisixHook.servicePort }}
      targetPort: http
