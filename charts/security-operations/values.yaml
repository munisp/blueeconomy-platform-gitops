# Security operations: detection engine + OpenCTI bridge.
# Environment contract aligned to the merged Go service source
# (blueeconomy-security-operations):
#   cmd/detection-engine: BESEC_POSTGRES_DSN, BESEC_WINDOW_RETENTION,
#     BESEC_HEALTH_LISTEN_ADDRESS, KEY_DIRECTORY_PATH, --rules flag
#     (internal/kafkax: BESEC_KAFKA_BROKERS/TOPICS/GROUP_ID/ALERT_TOPIC/
#     DLQ_TOPIC/SASL_USERNAME/SASL_PASSWORD/TLS). The engine keeps durable
#     window state in PostgreSQL; there is NO OpenSearch dependency.
#   cmd/opencti-bridge: BESEC_OPENCTI_URL + BESEC_OPENCTI_TOKEN, flags
#     --output/--ruleset-version[--strict]; it is a bounded generator run,
#     so it deploys as a CronJob, not a long-running Deployment.
# All credentials are ExternalSecrets-only; no placeholder or inline
# credential is permitted anywhere in this chart.
nameOverride: ""
fullnameOverride: ""
workstream: security

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# ExternalSecrets contract. storeRef.name references the sovereign landing
# zone's secret backend ClusterSecretStore (any ESO-supported provider:
# Azure Key Vault, HashiCorp Vault, or another operator-managed store;
# selection is deployment policy, not platform law).
externalSecrets:
  storeRef:
    name: ""
    kind: ClusterSecretStore
  refreshInterval: 1h
  keys: {}

dapr:
  enabled: true
  appProtocol: http
  metricsPort: 9090

components:
  detection-engine:
    enabled: true
    # Long-running Kafka consumer with durable PostgreSQL window state.
    kind: Deployment
    image:
      repository: ""
      digest: ""
      pullPolicy: IfNotPresent
    replicas: 2
    daprAppId: detection-engine
    # Operational HTTP listener (BESEC_HEALTH_LISTEN_ADDRESS): /healthz,
    # /readyz (fail-closed on PG window-state outage) and /metrics.
    port: 8080
    service:
      enabled: true
      type: ClusterIP
    probes:
      livenessPath: /healthz
      readinessPath: /readyz
    # Approved detection rule document (rules/detection-rules.yaml in the
    # service repo; detection-engineering lifecycle per
    # wazuh/detection-engineering-lifecycle.md). Mounted read-only and
    # passed via --rules; the binary exits without it. Environment values
    # carry the governance-approved document; render-gated non-empty.
    rules:
      document: ""
      mountPath: /etc/blueeconomy/detection-rules
    # Binary contract only (cmd/detection-engine, internal/kafkax). No
    # other env names are resolved by the binary.
    env:
      BESEC_KAFKA_BROKERS: ""
      # Comma-separated subscribe topics (ports.*, ferries.*, cvff.* ...).
      BESEC_KAFKA_TOPICS: ""
      BESEC_KAFKA_GROUP_ID: ""
      BESEC_KAFKA_ALERT_TOPIC: "security.alerts.v1"
      # Dead-letter topic for malformed well-signed events (binary-required).
      BESEC_KAFKA_DLQ_TOPIC: ""
      BESEC_KAFKA_TLS: "true"
      BESEC_WINDOW_RETENTION: "24h"
      BESEC_HEALTH_LISTEN_ADDRESS: ":8080"
    requiredEnv:
      - BESEC_KAFKA_BROKERS
      - BESEC_KAFKA_TOPICS
      - BESEC_KAFKA_GROUP_ID
      - BESEC_KAFKA_DLQ_TOPIC
      - BESEC_HEALTH_LISTEN_ADDRESS
    # BESEC_POSTGRES_DSN is boot-fatal in the binary; SASL credentials are
    # optional in the binary but required by the platform Kafka posture.
    secretEnv:
      - BESEC_POSTGRES_DSN
      - BESEC_KAFKA_SASL_USERNAME
      - BESEC_KAFKA_SASL_PASSWORD
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi

  opencti-bridge:
    enabled: true
    # Bounded generator run (pulls indicators, writes Wazuh XML + OpenAppSec
    # policy for the reviewed deployment process, exits). A Deployment
    # would crash-loop on every successful run; CronJob is the honest shape.
    kind: CronJob
    # Five-field cron; render-gated when the component is enabled.
    schedule: ""
    # --strict fails the run when OpenCTI is unreachable instead of writing
    # a degraded alert; prod posture renders strict.
    strict: true
    # Version label for generated content, supplied by the deployment
    # pipeline (the binary requires --ruleset-version, no default).
    rulesetVersion: ""
    image:
      repository: ""
      digest: ""
      pullPolicy: IfNotPresent
    daprAppId: opencti-bridge
    env:
      BESEC_OPENCTI_URL: ""
    requiredEnv:
      - BESEC_OPENCTI_URL
    secretEnv:
      - BESEC_OPENCTI_TOKEN
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi

networkPolicy:
  enabled: true
  allowedIngressNamespaces: []
  allowedEgress:
    - namespace: kube-system
      ports: [53]
      protocols: ["UDP", "TCP"]
    # Kafka (9092), PostgreSQL window state (5432) and OpenCTI namespaces are
    # appended by the environment values file. The security namespace never
    # egresses to workstream pods.

monitoring:
  serviceMonitor:
    # Scrapes the detection-engine operational listener (/metrics on the
    # BESEC_HEALTH_LISTEN_ADDRESS port) once a service is rendered.
    enabled: false
    path: /metrics
    interval: 30s
    labels:
      blueeconomy.platform/workstream: security
  podMonitor:
    enabled: true
    labels:
      blueeconomy.platform/workstream: security

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Producer-signature key directory consumption. The ConfigMap rendered by
# charts/opa-policies ({kid: base64url-ed25519-pubkey} for every approved
# platform producer) is mounted read-only at KEY_DIRECTORY_PATH so the
# detection engine verifies provenance.signature on every consumed event
# envelope instead of trusting network location. The binary REFUSES TO BOOT
# without KEY_DIRECTORY_PATH, so the render gate requires this to be enabled
# whenever the detection-engine component is enabled.
keyDirectory:
  enabled: false
  # Name of the opa-policies key-directory ConfigMap
  # (<opa-policies release fullname>-key-directory).
  configMapName: ""
  mountPath: /etc/blueeconomy/key-directory
