{{- $cronRe := "^\\S+\\s+\\S+\\s+\\S+\\s+\\S+\\s+\\S+$" -}}
{{- range $name, $component := .Values.components }}
{{- if $component.enabled }}
{{- $kind := $component.kind | default "Deployment" -}}
{{- if not (has $kind (list "Deployment" "CronJob")) -}}
{{- fail (printf "%s.kind must be one of: Deployment, CronJob" $name) -}}
{{- end -}}
{{- $digest := required (printf "%s.image.digest is required" $name) $component.image.digest -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) -}}
{{- fail (printf "%s.image.digest must be an immutable lower-case sha256 digest (no tag-only or :latest references)" $name) -}}
{{- end -}}
{{- $repository := required (printf "%s.image.repository is required" $name) $component.image.repository -}}
{{- $env := default dict $component.env -}}
{{- range $envName := (default (list) $component.requiredEnv) -}}
{{- if eq (printf "%v" (get $env $envName)) "" -}}
{{- fail (printf "%s.%s must be set to an approved environment value" $name $envName) -}}
{{- end -}}
{{- end -}}
{{- range $secretName := (default (list) $component.secretEnv) -}}
{{- if not (hasKey $.Values.externalSecrets.keys $secretName) -}}
{{- fail (printf "externalSecrets.keys.%s is required because %s consumes it via secretEnv" $secretName $name) -}}
{{- end -}}
{{- end -}}
{{- if eq $kind "CronJob" -}}
{{- if not (regexMatch $cronRe ($component.schedule | default "")) -}}
{{- fail (printf "%s.schedule is required (five-field cron) when the %s component is enabled; it is a bounded generator run and deploys as a CronJob" $name $name) -}}
{{- end -}}
{{- if and $component.service $component.service.enabled -}}
{{- fail (printf "%s is a CronJob (bounded run) and must not render a Service" $name) -}}
{{- end -}}
{{- end -}}
{{- end }}
{{- end }}
{{- $store := required "externalSecrets.storeRef.name is required" .Values.externalSecrets.storeRef.name -}}

{{- /* Detection-engine binary contract (cmd/detection-engine/main.go):
       --rules is flag-required and KEY_DIRECTORY_PATH is boot-fatal
       (provenance verification is fail-closed). */ -}}
{{- $engine := index .Values.components "detection-engine" -}}
{{- if $engine.enabled -}}
{{- if empty $engine.rules.document -}}
{{- fail "detection-engine.rules.document is required (the approved detection rule document; the binary exits without --rules)" -}}
{{- end -}}
{{- if not .Values.keyDirectory.enabled -}}
{{- fail "keyDirectory.enabled must be true: the detection engine refuses to boot without KEY_DIRECTORY_PATH (envelope provenance verification is fail-closed)" -}}
{{- end -}}
{{- end -}}
{{- $bridge := index .Values.components "opencti-bridge" -}}
{{- if $bridge.enabled -}}
{{- if empty $bridge.rulesetVersion -}}
{{- fail "opencti-bridge.rulesetVersion is required (the binary requires --ruleset-version; supplied by the deployment pipeline)" -}}
{{- end -}}
{{- end -}}
{{- if .Values.keyDirectory.enabled -}}
{{- $kd := required "keyDirectory.configMapName is required when keyDirectory.enabled=true (opa-policies key-directory ConfigMap)" .Values.keyDirectory.configMapName -}}
{{- if not (hasPrefix "/" .Values.keyDirectory.mountPath) -}}
{{- fail "keyDirectory.mountPath must be an absolute path" -}}
{{- end -}}
{{- end -}}
