# Tempo monolithic configuration: OTLP ingest (gateway -> tempo), local
# WAL + block cache on the PVC, S3-compatible block backend, compactor
# retention render-gated to the approved 7-30d band.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tempo.fullname" . }}
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
      grpc_listen_port: 9095
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      max_block_duration: 5m
      trace_idle_period: 10s
    compactor:
      compaction:
        block_retention: {{ .Values.retentionHours }}h
        compacted_block_retention: 1h
    storage:
      trace:
        backend: s3
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
        s3:
          bucket: {{ .Values.storage.bucket | quote }}
          endpoint: {{ .Values.storage.endpoint | quote }}
          region: {{ .Values.storage.region | quote }}
          access_key: ${env:TEMPO_S3_ACCESS_KEY}
          secret_key: ${env:TEMPO_S3_SECRET_KEY}
          insecure: false
          forcepathstyle: true
    metrics_generator_registry:
      external_labels:
        source: tempo
