# Novu network posture: Alertmanager webhook + ops dashboard/API access
# from the observability namespace and approved ops namespaces only;
# egress to MongoDB (27017), Redis (6379) and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "novu.fullname" . }}
  labels:
    {{- include "novu.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "novu.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
    {{- range .Values.networkPolicy.allowedIngressNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 4200
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.mongodbNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.dataStores.mongodb.port }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.redisNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.dataStores.redis.port }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
