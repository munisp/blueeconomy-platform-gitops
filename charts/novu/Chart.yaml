apiVersion: v2
name: novu
description: >-
  Novu (self-hosted, open-source MIT notification infrastructure) for the
  Blue Economy Platform observability foundation (OTEL_DESIGN.md section
  1): Alertmanager's sole receiver target — ops alerts now, citizen
  alerts later (email/SMS/Telegram-class/push workflows). Deploys the
  four Novu services (api, worker, ws, web) against external
  MongoDB/Redis data stores. Fail-closed: digest-pinned images, every
  credential (JWT secret, store encryption key, API key, data-store
  credentials) via ExternalSecrets only, data-store endpoints
  render-gated REQUIRED, resources required, NetworkPolicy, PodSecurity
  restricted. NOT_RUN: the deploy contract follows the Novu community
  self-host reference and has never been executed against a live cluster;
  validate the exact env contract against the approved Novu version's
  self-host documentation before first enablement.
type: application
version: 0.1.0
appVersion: "2.3.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - novu
  - notifications
  - alerting
  - blue-economy
annotations:
  blueeconomy.platform/criticality: "alert-delivery"
  blueeconomy.platform/upstream: "https://github.com/novuhq/novu (image novuhq/novu, MIT)"
  blueeconomy.platform/upstream-policy: "Pin verified upstream image digests; do not deploy unreviewed defaults"
  blueeconomy.platform/live-validation: "NOT_RUN — validate the env contract against the approved Novu version self-host reference before enablement"
