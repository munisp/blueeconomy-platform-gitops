apiVersion: v2
name: otel-collector-gateway
description: >-
  OpenTelemetry Collector gateway (central Deployment) for the Blue
  Economy Platform observability foundation (OTEL_DESIGN.md section 1):
  receives OTLP from the per-node agents, applies tenant attribution
  enforcement tagging (tenant.id/agency set at the edge/apps; the gateway
  tags unattributed telemetry instead of dropping it — telemetry never
  breaks the business path), tail-sampling policies (errors, slow spans,
  money-path spans always kept; probabilistic baseline), sensitive
  attribute redaction, CVFF FIDUCIARY_SEGREGATED labelling, and fans out
  to Tempo (traces), Loki (logs, native OTLP), and Prometheus (metrics
  exporter + self-telemetry feeding Alertmanager rules). Contrib image,
  digest-pinned, fail-closed value gates.
type: application
version: 0.1.0
appVersion: "0.158.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - opentelemetry
  - observability
  - collector
  - blue-economy
annotations:
  blueeconomy.platform/criticality: "observability-foundation"
  blueeconomy.platform/upstream: "https://github.com/open-telemetry/opentelemetry-collector-contrib (image otel/opentelemetry-collector-contrib)"
  blueeconomy.platform/upstream-policy: "Pin verified upstream image digests; do not deploy unreviewed defaults"
