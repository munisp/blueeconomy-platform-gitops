nameOverride: ""
fullnameOverride: ""

sparkOperator:
  # CRD/operator is a platform prerequisite and is not installed by this chart.
  apiVersion: sparkoperator.k8s.io/v1beta2
  kind: SparkApplication
  required: true

image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Required by the Spark driver to create and manage executors under the namespace Role.
  automountServiceAccountToken: true

rbac:
  create: true

job:
  enabled: true
  name: "vessel-trajectory-silver"
  schedule: "0 3 * * *"
  # A deployment pipeline may convert this to a scheduled SparkApplication or create CronJob submitter.
  mainApplicationFile: "local:///opt/blueeco/jobs/vessel_trajectory_silver.py"
  mainClass: ""
  arguments: []
  dataProduct:
    name: "vessel-trajectory-silver"
    classification: restricted
    inputTable: "bronze.vessel_observations"
    outputTable: "silver.vessel_trajectories"
    qualityContract: ""
    crs: "EPSG:4326"

spark:
  type: Python
  mode: cluster
  sparkVersion: ""
  restartPolicy:
    type: Never
  dynamicAllocation:
    enabled: false
  sparkConf:
    "spark.sql.extensions": "io.delta.sql.DeltaSparkSessionExtension"
    "spark.sql.catalog.spark_catalog": "org.apache.spark.sql.delta.catalog.DeltaCatalog"
    "spark.sql.session.timeZone": "UTC"
    "spark.kubernetes.allocation.batch.size": "5"
    "spark.sql.adaptive.enabled": "true"
  hadoopConf:
    # Supply object-store endpoint, catalog and auth via workload identity/external secret integration.
    "fs.s3a.path.style.access": "false"

driver:
  cores: 1
  coreLimit: "1500m"
  memory: "4g"
  serviceAccount: ""
  labels:
    blueeconomy.platform/workload: geospatial-driver
  # Optional references to approved ConfigMaps or ExternalSecret-produced Secrets.
  envFrom: []
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

executor:
  instances: 3
  cores: 2
  coreLimit: "2500m"
  memory: "8g"
  labels:
    blueeconomy.platform/workload: geospatial-executor
  # Optional references to approved ConfigMaps or ExternalSecret-produced Secrets.
  envFrom: []
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

nodeSelector:
  blueeconomy.platform/node-pool: geospatial-batch
tolerations: []

networkPolicy:
  enabled: true
  # Environment values must provide the real private/API service CIDRs before rendering.
  kubernetesAPIServerCIDRs: []
  kubernetesAPIServerPorts: [443]
  objectStoreCIDRs: []
  objectStorePorts: [443]
  kafkaNamespace: blueeco-kafka-prod
  kafkaPorts: [9093]
  catalogNamespace: blueeco-data-catalog
  catalogPorts: [443]

observability:
  logFormat: json
  # NOTE: the former `otelEnabled: true` key was declared but never
  # consumed by any template (dead config, removed honestly in W-OPS1).
  # The opt-in Spark-side OTel pattern below replaces it (default OFF).
  otel:
    javaagent:
      # Opt-in OTel Java agent on the Spark driver/executor JVMs
      # (W-OTEL follow-up; Sedona-on-Spark is batch-only at
      # jobs/vessel_trajectory_silver.py). The job image must carry the
      # agent jar at agentPath. HONEST COVERAGE: the javaagent
      # auto-instruments supported JVM libraries (HTTP/gRPC/JDBC clients)
      # and emits JVM runtime metrics; it does NOT trace Spark's own
      # scheduler/stages (no Spark instrumentation module exists) and it
      # does NOT trace the PySpark Python worker or the Sedona geometry
      # UDFs — job-level spans remain the Python-side spans wrapping the
      # job submission (W-OTEL data-platform wave).
      enabled: false
      agentPath: /opt/otel/opentelemetry-javaagent.jar
      # OTLP/gRPC endpoint of the collector. Render-gated: enabling the
      # agent without an endpoint is refused (telemetry must never
      # silently vanish — OTP2 javaagent precedent).
      otlpEndpoint: ""
      # Collector namespace for the NetworkPolicy egress rule (render-gated
      # when enabled).
      collectorNamespace: ""
  prometheus:
    # Spark Prometheus servlet sink: the Spark metrics system (JMX
    # source: driver/executor gauges, DAGScheduler, BlockManager, JVM)
    # exposed on the Spark UI ports for Prometheus scrape. This is the
    # Spark-side metrics pattern; Sedona geometry metrics exist only if
    # the job code registers them.
    enabled: false
    # Namespace Prometheus scrapes from (NetworkPolicy ingress; render-
    # gated when enabled).
    scrapeNamespace: ""
  kubecostLabels:
    blueeconomy.platform/domain: S2-S5-S6
    blueeconomy.platform/cost-center: geospatial-analytics

qualityGate:
  enabled: true
  # The job code writes validation/quarantine status; this chart only supplies the identity and configuration.
  failOnInvalidGeometry: true
  failOnUnexpectedSchema: true
  maximumRejectedRecordPercent: "0.5"
