{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ default (printf "%s-sedona-network" .Release.Name) .Values.fullnameOverride | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: sedona-spark-jobs
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchExpressions:
      - key: spark-role
        operator: In
        values: ["driver", "executor"]
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: spark-role
                operator: In
                values: ["driver", "executor"]
    {{- if .Values.observability.prometheus.enabled }}
    # Prometheus scrape of the Spark Prometheus servlet sink (UI :4040).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observability.prometheus.scrapeNamespace | quote }}
      ports:
        - protocol: TCP
          port: 4040
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: spark-role
                operator: In
                values: ["driver", "executor"]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- range .Values.networkPolicy.kubernetesAPIServerCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.kubernetesAPIServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        {{- range .Values.networkPolicy.objectStoreCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.objectStorePorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.kafkaNamespace | quote }}
      ports:
        {{- range .Values.networkPolicy.kafkaPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.catalogNamespace | quote }}
      ports:
        {{- range .Values.networkPolicy.catalogPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- if .Values.observability.otel.javaagent.enabled }}
    # OTLP egress for the opt-in javaagent (render-gated endpoint).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observability.otel.javaagent.collectorNamespace | quote }}
      ports:
        - protocol: TCP
          port: 4317
    {{- end }}
{{- end }}
