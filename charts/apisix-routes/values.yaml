# APISIX route registrations (gap #49). The edge topology is
# client -> Caddy -> OpenAppSec -> APISIX -> Dapr -> services; these
# ApisixRoute CRs are the APISIX hop for services that previously terminated
# on plain Ingress. Render-gated to the apisix flag.
nameOverride: ""
fullnameOverride: ""

apisix:
  # Routes render by default against the pinned upstream APISIX release
  # (components/upstream-components.lock.yaml: apache-apisix); the
  # fail-closed gates are the required landing-zone values below (gateway
  # namespace, OPA service, per-route approved hostnames).
  enabled: true
  # APISIX gateway listener namespace (Caddy proxies here).
  namespace: blueeconomy-security
  # OPA hook contract, consistent with charts/opa-policies apisixHook:
  # every route evaluates policy blueeconomy/http/allow on the OPA service.
  opa:
    policy: blueeconomy/http/allow
    # In-cluster OPA service name (the opa-policies release). Render-gated.
    serviceName: ""
    servicePort: 8181

# Route inventory, ported from the platform's authoritative APISIX route
# file (blueeconomy/deploy/security/apisix.yaml) so the render gates apply
# (GAP-SEC-03). Every entry:
#   name:     route name (also the ApisixRoute CR name suffix)
#   host:     approved edge hostname (environment-supplied; render-gated)
#   paths:    absolute path prefixes (/* suffix style)
#   methods:  approved HTTP methods
#   service:  backend Kubernetes Service (namespace/name/port)
#   scopes:   Keycloak OIDC scopes required on the route (bearer-only)
#   rateLimit: optional identity-aware limit-req override {rate, burst, key}
routes:
  # S1 port interoperability API (upstream s1-port-interoperability).
  - name: platform-s1
    host: ""
    paths:
      - /v1/port/*
    methods: [GET, POST, PUT]
    service:
      namespace: blueeconomy-ports
      name: port-interoperability-port-interoperability-api
      port: 8080
    scopes:
      - s1
    rateLimit:
      rate: 20
      burst: 40
      key: "$consumer_name$remote_addr"
  # Partner national-single-window submissions (upstream s1, bearer-only).
  - name: partner-nsw
    host: ""
    paths:
      - /v1/nsw/*
    methods: [POST]
    service:
      namespace: blueeconomy-ports
      name: port-interoperability-port-interoperability-api
      port: 8080
    scopes:
      - partner.nsw
    rateLimit:
      rate: 10
      burst: 20
      key: remote_addr
  # S2 maritime-intelligence feed sources (upstream s2-maritime-intelligence).
  - name: platform-s2
    host: ""
    paths:
      - /v1/feed-sources/*
    methods: [GET, POST]
    service:
      namespace: blueeconomy-isr
      name: maritime-intelligence-maritime-intelligence-api
      port: 8080
    scopes:
      - s2
    rateLimit:
      rate: 15
      burst: 30
      key: "$consumer_name$remote_addr"
  # CVFF beneficiary API (audit G2): the ONLY server of
  # /v1/cvff/applications* consumed by blueeconomy-beneficiary-portal
  # (financial-controls values, FC-4). Upstream is the cvff-api component
  # Service of the financial-controls release.
  - name: cvff-beneficiary
    host: ""
    paths:
      - /v1/cvff/applications
      - /v1/cvff/applications/*
    methods: [GET, POST]
    service:
      namespace: blueeconomy-cvff
      name: financial-controls-financial-controls-cvff-api
      port: 8081
    scopes:
      - cvff
    rateLimit:
      rate: 20
      burst: 40
      key: "$consumer_name$remote_addr"
  # Ferry ticketing API (audit G2): mobile gate/inspector ticket
  # verification (POST /v1/tickets/verify) and verification-key refresh
  # (GET /v1/tickets/verification-keys) on the ferry-api component.
  - name: ferry-ticketing
    host: ""
    paths:
      - /v1/tickets/*
    methods: [GET, POST]
    service:
      namespace: blueeconomy-ferries
      name: ferry-ticketing-ferry-ticketing-ferry-api
      port: 8080
    scopes:
      - ferry
    rateLimit:
      rate: 20
      burst: 40
      key: "$consumer_name$remote_addr"
  # Credential verification API (audit G2): mobile seafarer wallet reads
  # (GET /v1/wallet/credentials/*, /v1/issuers/*/key, /v1/status-lists/*)
  # on the credential-api component.
  - name: credential-verification
    host: ""
    paths:
      - /v1/wallet/*
      - /v1/issuers/*
      - /v1/status-lists/*
    methods: [GET]
    service:
      namespace: blueeconomy-seafarer
      name: credential-verification-credential-verification-credential-api
      port: 8080
    scopes:
      - seafarer
    rateLimit:
      rate: 20
      burst: 40
      key: "$consumer_name$remote_addr"
  # Fisheries traceability API (audit G2): mobile catch sync
  # (POST /v1/catches/sync) on the trace-api component.
  - name: fisheries-traceability
    host: ""
    paths:
      - /v1/catches/*
    methods: [POST]
    service:
      namespace: blueeconomy-fisheries
      name: fisheries-traceability-fisheries-traceability-trace-api
      port: 8080
    scopes:
      - fisheries
    rateLimit:
      rate: 10
      burst: 20
      key: "$consumer_name$remote_addr"
  # Mobile eCallUp + push registration on port-interoperability (audit
  # G2): slot bookings (POST /v1/bookings), queue requests
  # (POST /v1/queue-requests) and push-token registration
  # (POST /v1/push-tokens, blueeconomy-mobile pushRegistration.ts).
  # NOTE: the port-interoperability backend does not yet implement
  # /v1/push-tokens (verified against blueeconomy-port-interoperability
  # main) — the route is registered so the edge contract is complete; the
  # backend handler is tracked as a separate backend gap.
  - name: mobile-port-interop
    host: ""
    paths:
      - /v1/push-tokens
      - /v1/bookings
      - /v1/bookings/*
      - /v1/queue-requests
      - /v1/queue-requests/*
    methods: [GET, POST]
    service:
      namespace: blueeconomy-ports
      name: port-interoperability-port-interoperability-api
      port: 8080
    scopes:
      - s1
    rateLimit:
      rate: 20
      burst: 40
      key: "$consumer_name$remote_addr"

# Edge-native observability (OTEL_DESIGN.md section 3).
edgeObservability:
  opentelemetry:
    # opentelemetry plugin on every route: edge ROOT spans, traceparent
    # injected downstream. The collector endpoint lives in the APISIX
    # instance's plugin_attr (upstream release values) — this chart
    # render-gates only the sampling contract.
    enabled: true
    # Default per-route trace-id-ratio fraction (routes may override via
    # otlp.sampleFraction); render-gated to (0, 1].
    sampleFraction: 1.0
  prometheus:
    # prometheus plugin on every route (per-route RED metrics).
    enabled: true
    serviceMonitor:
      # Gateway-level scrape of the APISIX prometheus export
      # (/apisix/prometheus/metrics) on the pinned upstream APISIX Service
      # (PRA-066). Render-gated: enabling the monitor while the per-route
      # prometheus plugin above is disabled is refused — never wire a
      # scrape target the gateway does not serve (OTP2 honesty precedent).
      enabled: false
      # APISIX gateway Service exposing the prometheus export port
      # (render-gated when enabled).
      serviceName: ""
      port: 9091
      path: /apisix/prometheus/metrics
      labels:
        blueeconomy.platform/workstream: platform

# OpenAppSec WAF agent (embedded in the APISIX pod per the caddy chart
# contract): Prometheus scrape wiring. NOTE (vendor limitation, recorded
# honestly): the agent emits NO traces; its security events ship to Loki
# via the collector (filelog/syslog on the agent's event volume/socket —
# additive collector config, recorded here so the gap is explicit).
openappsec:
  serviceMonitor:
    enabled: false
    # APISIX Service exposing the agent metrics port (render-gated when
    # enabled).
    serviceName: ""
    port: 8111
    path: /metrics
    labels:
      blueeconomy.platform/workstream: security
