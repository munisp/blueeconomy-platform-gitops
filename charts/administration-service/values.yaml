# blueeconomy-administration-service deploy surface (cmd/admin-service;
# env contract: internal/admin/config.go). Every credential arrives
# exclusively through ExternalSecrets; no placeholder or inline credential
# is permitted anywhere in this chart. Cloud-agnostic: any conformant
# Kubernetes, any secret-store backend via the ESO ClusterSecretStore enum
# (docs/cloud-agnosticism.md).
nameOverride: ""
fullnameOverride: ""

image:
  repository: ""
  # Pin to an immutable digest after SBOM, vulnerability and compatibility approval.
  digest: ""
  pullPolicy: IfNotPresent

replicas: 2
# Container/service port; ADMIN_SERVICE_LISTEN_ADDRESS below must bind it.
port: 8080

# Non-secret environment. Names are exactly the binary contract
# (internal/admin/config.go). Values must be approved environment values;
# every name in requiredEnv (and the auth-mode-specific names enforced by
# the validation gate) must be set or the render fails closed.
env:
  # HTTP listen address of the administration API (binary:
  # ADMIN_SERVICE_LISTEN_ADDRESS; required by the binary).
  ADMIN_SERVICE_LISTEN_ADDRESS: ":8080"
  # Mount path of the PBAC policy pack rendered by this chart
  # (pbac.policies below). The binary refuses to boot without a readable
  # directory of .rego modules (internal/pbac).
  ADMIN_PBAC_POLICY_DIR: /etc/blueeconomy/admin-pbac
  # Edge authn mode: jwt (direct OIDC verification) or trusted_proxy
  # (APISIX terminates OIDC and asserts verified claims).
  ADMIN_AUTH_MODE: ""
  # jwt mode only (required when ADMIN_AUTH_MODE=jwt):
  ADMIN_OIDC_ISSUER: ""
  ADMIN_OIDC_AUDIENCE: ""
  ADMIN_OIDC_JWKS_URL: ""
  # Optional comma-separated additional client ids whose tokens carry roles.
  # ADMIN_OIDC_ROLES_CLIENT_IDS: ""
  # trusted_proxy mode only (required when ADMIN_AUTH_MODE=trusted_proxy):
  ADMIN_TRUSTED_PROXY_IDENTITY: ""
  ADMIN_TRUSTED_PROXY_CIDRS: ""
  # Keycloak administrative coordinates (all HTTPS, no credentials/query).
  KEYCLOAK_TOKEN_URL: ""
  KEYCLOAK_ADMIN_BASE_URL: ""
  KEYCLOAK_REALM: ""
  KEYCLOAK_ORGANIZATION_ID: ""
  KEYCLOAK_ADMIN_CLIENT_ID: ""
  KEYCLOAK_SERVICE_ACTOR_SUBJECT: ""
  # Comma-separated approved onboarding roles; every role must have an
  # entry in KEYCLOAK_ROLE_GROUP_MAPPING_JSON (enforced at render time,
  # exactly like the binary's fail-closed boot check).
  ONBOARDING_ALLOWED_ROLES: ""
  # JSON object mapping each approved role to its Keycloak group id.
  KEYCLOAK_ROLE_GROUP_MAPPING_JSON: ""
  # Public self-service enrollment rate limit (1..100000 per minute; a
  # missing/invalid limit disables enrollment in the binary).
  ADMIN_ENROLLMENT_RATE_LIMIT_PER_MINUTE: ""

requiredEnv:
  - ADMIN_SERVICE_LISTEN_ADDRESS
  - ADMIN_PBAC_POLICY_DIR
  - ADMIN_AUTH_MODE
  - KEYCLOAK_TOKEN_URL
  - KEYCLOAK_ADMIN_BASE_URL
  - KEYCLOAK_REALM
  - KEYCLOAK_ORGANIZATION_ID
  - KEYCLOAK_ADMIN_CLIENT_ID
  - KEYCLOAK_SERVICE_ACTOR_SUBJECT
  - ONBOARDING_ALLOWED_ROLES
  - KEYCLOAK_ROLE_GROUP_MAPPING_JSON
  - ADMIN_ENROLLMENT_RATE_LIMIT_PER_MINUTE

# ExternalSecrets contract. storeRef.name references the landing zone's
# secret backend ClusterSecretStore (any ESO-supported provider). keys maps
# in-cluster secret keys to remote refs; the three mandatory keys below are
# the complete secret surface of the binary:
#   ADMIN_SERVICE_POSTGRES_DSN   — libpq DSN for the administration role
#   KEYCLOAK_ADMIN_CLIENT_SECRET — Keycloak admin client credential
#   PROVENANCE_SIGNING_KEY       — base64url Ed25519 provenance signing key
#                                  (legacy `provenance` convention per
#                                  docs/signing-config.md; the binary's
#                                  internal/provenance reads exactly this
#                                  name — migration to the envelope
#                                  convention follows the documented
#                                  deprecation path)
externalSecrets:
  storeRef:
    name: ""
    kind: ClusterSecretStore
  refreshInterval: 1h
  keys: {}

# PBAC policy pack (internal/pbac: a mounted directory of .rego modules;
# the binary refuses to boot without it). Rendered into a ConfigMap and
# mounted read-only at env.ADMIN_PBAC_POLICY_DIR. At least one .rego module
# is required (fail-closed); the approved baseline is
# policies/admin.rego in blueeconomy-administration-service.
pbac:
  policies: {}

networkPolicy:
  enabled: true
  # Edge ingress only (APISIX namespace); the service enforces its own
  # PBAC/role policy behind edge authn.
  apisixNamespace: ""
  postgisNamespace: ""
  keycloakNamespace: ""

resources:
  requests:
    cpu: ""
    memory: ""
  limits:
    cpu: ""
    memory: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# The binary serves GET /healthz (public) plus the /v1 administration
# routes (internal/admin/authz.go); there is no /metrics endpoint.
probes:
  livenessPath: /healthz
  readinessPath: /healthz

serviceMonitor:
  # PRA-066 audited: NO ServiceMonitor is wired for this service because
  # the binary serves no /metrics endpoint (only the uncharted
  # admin-notifier exposes expvar /debug/vars). enabled=true is refused at
  # render time — never a phantom scrape target (OTP2 honesty precedent).
  # Edge-level RED metrics for this service come from the APISIX
  # prometheus plugin (apisix-routes edgeObservability.prometheus).
  enabled: false

podDisruptionBudget:
  # Multi-replica Deployment: keep at least one pod serving during
  # voluntary disruptions.
  enabled: true
  minAvailable: 1

hpa:
  # CPU-based horizontal autoscaling (stateless service; GAP-PG-07).
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
