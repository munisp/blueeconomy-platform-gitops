apiVersion: v1
kind: Service
metadata:
  name: {{ include "ministry-portal.fullname" . }}
  labels:
    {{- include "ministry-portal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ministry-portal.selectorLabels" . | nindent 4 }}
