{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ministry-portal.fullname" . }}
  labels:
    {{- include "ministry-portal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ministry-portal.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Approved ingress edge namespaces (APISIX) to the portal HTTP port.
    {{- range .Values.networkPolicy.allowedIngressNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.port }}
    {{- end }}
  egress:
    {{- range .Values.networkPolicy.allowedEgress }}
    {{- $rule := . }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $rule.namespace | quote }}
      ports:
        {{- range $proto := (default (list "TCP") $rule.protocols) }}
        {{- range $port := $rule.ports }}
        - protocol: {{ $proto }}
          port: {{ $port }}
        {{- end }}
        {{- end }}
    {{- end }}
{{- end }}
