apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default (printf "%s-mojaloop-overlay" .Release.Name) .Values.fullnameOverride | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: mojaloop-overlay
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    blueeconomy.platform/criticality: regulated-payment-integration
data:
  upstream-chart-name: {{ required "upstream.chartName must be set" .Values.upstream.chartName | quote }}
  upstream-chart-version: {{ required "upstream.chartVersion must be set" .Values.upstream.chartVersion | quote }}
  upstream-repository: {{ required "upstream.repository must be set" .Values.upstream.repository | quote }}
  private-administration: {{ .Values.namespacePolicy.enforcePrivateAdministration | quote }}
  ingress-controller: {{ .Values.namespacePolicy.permittedIngressController | quote }}
  oidc-issuer-url: {{ required "identity.keycloak.issuerURL must be set" .Values.identity.keycloak.issuerURL | quote }}
  oidc-jwks-uri: {{ required "identity.keycloak.jwksURI must be set" .Values.identity.keycloak.jwksURI | quote }}
  oidc-allowed-signing-algorithms: {{ join "," .Values.identity.keycloak.assertions.allowedSigningAlgorithms | quote }}
  oidc-maximum-clock-skew-seconds: {{ .Values.identity.keycloak.assertions.maximumClockSkewSeconds | quote }}
  apisix-plugin-set-reference: {{ .Values.apiGateway.attachment.pluginSetReference | quote }}
  apisix-plugin-set-sha256: {{ .Values.apiGateway.attachment.pluginSetSHA256 | quote }}
  apisix-policy-change-approval-reference: {{ .Values.apiGateway.attachment.policyChangeApprovalRef | quote }}
  apisix-require-tls12-minimum: {{ .Values.apiGateway.requireTLS12Minimum | quote }}
  apisix-reject-bearer-token-query-parameters: {{ .Values.apiGateway.rejectBearerTokenQueryParameters | quote }}
  apisix-partner-route-contracts: {{ toJson .Values.apiGateway.partnerRoutes | quote }}
  settlement-authority: {{ required "operations.settlementAuthority must be set" .Values.operations.settlementAuthority | quote }}
  production-gate-approvals: {{ join "," .Values.productionGate.requiredApprovals | quote }}
  production-gate-tests: {{ join "," .Values.productionGate.requiredTests | quote }}
