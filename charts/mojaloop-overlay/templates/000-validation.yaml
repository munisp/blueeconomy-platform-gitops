{{- $requiredValues := dict
  "upstream.chartName" .Values.upstream.chartName
  "upstream.chartVersion" .Values.upstream.chartVersion
  "upstream.repository" .Values.upstream.repository
  "identity.keycloak.issuerURL" .Values.identity.keycloak.issuerURL
  "identity.keycloak.jwksURI" .Values.identity.keycloak.jwksURI
  "identity.keycloak.clientSecretRef.name" .Values.identity.keycloak.clientSecretRef.name
  "identity.keycloak.clientSecretRef.key" .Values.identity.keycloak.clientSecretRef.key
  "identity.mTLS.certificateSecretRef.name" .Values.identity.mTLS.certificateSecretRef.name
  "identity.mTLS.certificateSecretRef.key" .Values.identity.mTLS.certificateSecretRef.key
  "identity.mTLS.trustedCASecretRef.name" .Values.identity.mTLS.trustedCASecretRef.name
  "identity.mTLS.trustedCASecretRef.key" .Values.identity.mTLS.trustedCASecretRef.key
  "apiGateway.attachment.pluginSetReference" .Values.apiGateway.attachment.pluginSetReference
  "apiGateway.attachment.policyChangeApprovalRef" .Values.apiGateway.attachment.policyChangeApprovalRef
  "backingServices.mysql.host" .Values.backingServices.mysql.host
  "backingServices.mysql.secretRef" .Values.backingServices.mysql.secretRef
  "backingServices.redis.host" .Values.backingServices.redis.host
  "backingServices.redis.secretRef" .Values.backingServices.redis.secretRef
  "operations.auditExport.kafkaTopic" .Values.operations.auditExport.kafkaTopic
  "operations.settlementAuthority" .Values.operations.settlementAuthority
-}}
{{- range $name, $value := $requiredValues -}}
{{- if or (empty $value) (contains "REPLACE_WITH" $value) (contains "REQUIRED_APPROVED" $value) -}}
{{- fail (printf "%s must contain an approved non-placeholder value" $name) -}}
{{- end -}}
{{- end -}}
{{- if not (regexMatch "^https://[^/]+(/.*)?$" .Values.identity.keycloak.issuerURL) -}}
{{- fail "identity.keycloak.issuerURL must be an HTTPS issuer URL" -}}
{{- end -}}
{{- if not (regexMatch "^https://[^/]+(/.*)?$" .Values.identity.keycloak.jwksURI) -}}
{{- fail "identity.keycloak.jwksURI must be an HTTPS JWKS URL" -}}
{{- end -}}
{{- range $name, $enabled := dict "requireIssuerExactMatch" .Values.identity.keycloak.assertions.requireIssuerExactMatch "requireJWKSValidation" .Values.identity.keycloak.assertions.requireJWKSValidation "requireExpiry" .Values.identity.keycloak.assertions.requireExpiry "requireNotBefore" .Values.identity.keycloak.assertions.requireNotBefore -}}
{{- if not $enabled -}}
{{- fail (printf "identity.keycloak.assertions.%s must remain true" $name) -}}
{{- end -}}
{{- end -}}
{{- if or (lt (int .Values.identity.keycloak.assertions.maximumClockSkewSeconds) 0) (gt (int .Values.identity.keycloak.assertions.maximumClockSkewSeconds) 120) -}}
{{- fail "identity.keycloak.assertions.maximumClockSkewSeconds must be between 0 and 120" -}}
{{- end -}}
{{- if eq (len .Values.identity.keycloak.assertions.allowedSigningAlgorithms) 0 -}}
{{- fail "identity.keycloak.assertions.allowedSigningAlgorithms must contain at least one approved asymmetric algorithm" -}}
{{- end -}}
{{- range $index, $algorithm := .Values.identity.keycloak.assertions.allowedSigningAlgorithms -}}
{{- if not (has $algorithm (list "RS256" "PS256" "ES256")) -}}
{{- fail (printf "identity.keycloak.assertions.allowedSigningAlgorithms[%d] must be RS256, PS256 or ES256" $index) -}}
{{- end -}}
{{- end -}}
{{- if not .Values.identity.keycloak.enabled -}}
{{- fail "identity.keycloak.enabled must remain true for the regulated payment overlay" -}}
{{- end -}}
{{- if not .Values.identity.mTLS.enabled -}}
{{- fail "identity.mTLS.enabled must remain true for the regulated payment overlay" -}}
{{- end -}}
{{- if ne .Values.secrets.provider "external-secrets" -}}
{{- fail "secrets.provider must be external-secrets; chart values must not contain secret material" -}}
{{- end -}}
{{- range $index, $ref := .Values.secrets.requiredRefs -}}
{{- if empty $ref -}}
{{- fail (printf "secrets.requiredRefs[%d] must not be empty" $index) -}}
{{- end -}}
{{- end -}}
{{- if not .Values.namespacePolicy.enforcePrivateAdministration -}}
{{- fail "namespacePolicy.enforcePrivateAdministration must remain true" -}}
{{- end -}}
{{- if ne .Values.namespacePolicy.permittedIngressController "apisix" -}}
{{- fail "namespacePolicy.permittedIngressController must be apisix" -}}
{{- end -}}
{{- if not .Values.namespacePolicy.requireNetworkPolicies -}}
{{- fail "namespacePolicy.requireNetworkPolicies must remain true" -}}
{{- end -}}
{{- if ne .Values.namespacePolicy.requirePodSecurityStandard "restricted" -}}
{{- fail "namespacePolicy.requirePodSecurityStandard must remain restricted" -}}
{{- end -}}
{{- if not .Values.upstream.imagePolicy.requireDigestPinning -}}
{{- fail "upstream.imagePolicy.requireDigestPinning must remain true" -}}
{{- end -}}
{{- if not .Values.upstream.imagePolicy.requireSignedArtifacts -}}
{{- fail "upstream.imagePolicy.requireSignedArtifacts must remain true" -}}
{{- end -}}
{{- if not .Values.upstream.imagePolicy.requireSBOM -}}
{{- fail "upstream.imagePolicy.requireSBOM must remain true" -}}
{{- end -}}
{{- if ne .Values.backingServices.mysql.mode "external-managed" -}}
{{- fail "backingServices.mysql.mode must be external-managed" -}}
{{- end -}}
{{- if ne .Values.backingServices.redis.mode "external-managed" -}}
{{- fail "backingServices.redis.mode must be external-managed" -}}
{{- end -}}
{{- if not .Values.apiGateway.adminRoutesPrivate -}}
  {{- fail "apiGateway.adminRoutesPrivate must remain true" -}}
{{- end -}}
{{- if not (regexMatch "^[a-fA-F0-9]{64}$" .Values.apiGateway.attachment.pluginSetSHA256) -}}
  {{- fail "apiGateway.attachment.pluginSetSHA256 must be a 64-character SHA-256 digest" -}}
{{- end -}}
{{- if eq (len .Values.apiGateway.partnerRoutes) 0 -}}
  {{- fail "apiGateway.partnerRoutes must contain at least one approved partner route" -}}
{{- end -}}

{{- if not .Values.apiGateway.requireOIDCAudienceValidation -}}
{{- fail "apiGateway.requireOIDCAudienceValidation must remain true" -}}
{{- end -}}
{{- if not .Values.apiGateway.requireOIDCScopeValidation -}}
{{- fail "apiGateway.requireOIDCScopeValidation must remain true" -}}
{{- end -}}
{{- if not .Values.apiGateway.requireTLS12Minimum -}}
{{- fail "apiGateway.requireTLS12Minimum must remain true" -}}
{{- end -}}
{{- if not .Values.apiGateway.rejectBearerTokenQueryParameters -}}
{{- fail "apiGateway.rejectBearerTokenQueryParameters must remain true" -}}
{{- end -}}
{{- if not .Values.apiGateway.requireCorrelationID -}}
{{- fail "apiGateway.requireCorrelationID must remain true" -}}
{{- end -}}
{{- if not .Values.apiGateway.requireSchemaValidation -}}
{{- fail "apiGateway.requireSchemaValidation must remain true" -}}
{{- end -}}
{{- if not .Values.apiGateway.requireOpenAppSec -}}
{{- fail "apiGateway.requireOpenAppSec must remain true" -}}
{{- end -}}
{{- if not .Values.operations.auditExport.enabled -}}
{{- fail "operations.auditExport.enabled must remain true" -}}
{{- end -}}
{{- if not .Values.operations.backup.required -}}
{{- fail "operations.backup.required must remain true" -}}
{{- end -}}
{{- if not .Values.operations.dailyReconciliation.required -}}
{{- fail "operations.dailyReconciliation.required must remain true" -}}
{{- end -}}
{{- range $index, $route := .Values.apiGateway.partnerRoutes -}}
  {{- range $name, $value := dict "name" $route.name "hostname" $route.hostname "pathPrefix" $route.pathPrefix "rateLimitPolicy" $route.rateLimitPolicy "audience" $route.audience "schemaProfile" $route.schemaProfile -}}

{{- if or (empty $value) (contains "REPLACE_WITH" $value) -}}
{{- fail (printf "apiGateway.partnerRoutes[%d].%s must contain an approved non-placeholder value" $index $name) -}}
{{- end -}}
{{- end -}}
  {{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._-]{1,127}$" $route.name) -}}
    {{- fail (printf "apiGateway.partnerRoutes[%d].name must be a canonical route identifier" $index) -}}
  {{- end -}}
  {{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9.-]{1,253}[A-Za-z0-9]$" $route.hostname) -}}
    {{- fail (printf "apiGateway.partnerRoutes[%d].hostname must be a DNS hostname" $index) -}}
  {{- end -}}
  {{- if ne $route.hostname (lower $route.hostname) -}}
    {{- fail (printf "apiGateway.partnerRoutes[%d].hostname must be lowercase" $index) -}}
  {{- end -}}
  {{- if eq (len $route.scopes) 0 -}}
    {{- fail (printf "apiGateway.partnerRoutes[%d].scopes must contain at least one approved scope" $index) -}}
  {{- end -}}
  {{- if ne (len $route.scopes) (len (uniq $route.scopes)) -}}
    {{- fail (printf "apiGateway.partnerRoutes[%d].scopes must not contain duplicates" $index) -}}
  {{- end -}}
  {{- range $scopeIndex, $scope := $route.scopes -}}
    {{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9._:-]{1,255}$" $scope) -}}
      {{- fail (printf "apiGateway.partnerRoutes[%d].scopes[%d] must be a canonical scope identifier" $index $scopeIndex) -}}
    {{- end -}}
  {{- end -}}
  {{- if not (regexMatch "^/[A-Za-z0-9._~!$&'()*+,;=:@%/-]*$" $route.pathPrefix) -}}

{{- fail (printf "apiGateway.partnerRoutes[%d].pathPrefix must be an absolute path without traversal" $index) -}}
{{- end -}}
  {{- if eq (len $route.allowedMethods) 0 -}}
    {{- fail (printf "apiGateway.partnerRoutes[%d].allowedMethods must contain at least one approved method" $index) -}}
  {{- end -}}
  {{- if ne (len $route.allowedMethods) (len (uniq $route.allowedMethods)) -}}
    {{- fail (printf "apiGateway.partnerRoutes[%d].allowedMethods must not contain duplicates" $index) -}}
  {{- end -}}
  {{- range $methodIndex, $method := $route.allowedMethods -}}

{{- if not (has $method (list "GET" "POST" "PUT" "PATCH" "DELETE")) -}}
{{- fail (printf "apiGateway.partnerRoutes[%d].allowedMethods[%d] must be GET, POST, PUT, PATCH or DELETE" $index $methodIndex) -}}
{{- end -}}
{{- end -}}
  {{- if not $route.requireMTLS -}}
    {{- fail (printf "apiGateway.partnerRoutes[%d].requireMTLS must remain true" $index) -}}
  {{- end -}}
{{- end -}}
{{- $routeKeys := dict -}}
{{- range $index, $route := .Values.apiGateway.partnerRoutes -}}
  {{- $routeKey := printf "%s|%s" $route.hostname $route.pathPrefix -}}
  {{- if hasKey $routeKeys $routeKey -}}
    {{- fail (printf "apiGateway.partnerRoutes[%d] duplicates hostname and pathPrefix of another route" $index) -}}
  {{- end -}}
  {{- $_ := set $routeKeys $routeKey true -}}
{{- end -}}
