{{- $clusterName := .Values.cluster.name -}}
{{- if not (empty .Values.caDistribution.namespaces) -}}
{{- range $ns := .Values.caDistribution.namespaces }}
---
# Distribute the operator-published cluster CA ({{ $clusterName }}-cluster-ca-cert,
# key ca.crt) into consumer namespace {{ $ns }} via the repo's
# external-secrets pattern. Secret NAMES only; certificate content is
# synced by the operator/ESO, never stored in this repository. Consumers
# such as the Dapr Kafka pubsub component reference this Secret
# (ci/render-values/dapr-components-kafka-tls.yaml).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-cluster-ca-cert
  namespace: {{ $ns | quote }}
  labels:
    {{- include "kafka-security.labels" $ | nindent 4 }}
    blueeconomy.platform/component: event-bus
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.storeRef.name }}
    kind: {{ $.Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ $.Values.caDistribution.targetSecretName | quote }}
  data:
    - secretKey: ca.crt
      remoteRef:
        # The environment secret store mirrors the operator-generated
        # cluster CA Secret; the remote key naming is an approved
        # environment contract.
        key: kafka/{{ $clusterName }}/cluster-ca-cert
        property: ca.crt
{{- end }}
{{- end }}
