{{- $clusterName := .Values.cluster.name -}}
{{- range $u := .Values.users }}
---
# KafkaUser for {{ $u.name }}: SCRAM-SHA-512 credentials are generated by
# the user operator into a Secret named {{ $u.name }} in the cluster
# namespace (name-only contract; no credential material in this repo).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: {{ $u.name | quote }}
  labels:
    {{- include "kafka-security.labels" $ | nindent 4 }}
    strimzi.io/cluster: {{ $clusterName | quote }}
spec:
  authentication:
    type: scram-sha-512
  {{- if $u.acls }}
  authorization:
    type: simple
    acls:
      {{- range $acl := $u.acls }}
      - resource:
          type: {{ $acl.resource.type }}
          name: {{ $acl.resource.name | quote }}
          patternType: {{ ($acl.resource.patternType) | default "literal" }}
        operations:
          {{- toYaml $acl.operations | nindent 10 }}
        host: "*"
      {{- end }}
  {{- end }}
{{- end }}
