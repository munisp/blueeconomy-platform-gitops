{{- if .Values.monitoring.serviceMonitor.enabled }}
# TigerBeetle metrics scrape (PRA-066). TigerBeetle itself serves NO HTTP
# metrics endpoint (the process speaks only the TigerBeetle binary
# protocol); monitoring.metricsPort is the approved exporter/sidecar port.
# 000-validation.yaml refuses this monitor without an approved exporter
# port — never a phantom scrape target on the system of record.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tigerbeetle.fullname" . }}
  labels:
    {{- include "tigerbeetle.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "tigerbeetle.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
{{- end }}
