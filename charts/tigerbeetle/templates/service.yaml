apiVersion: v1
kind: Service
metadata:
  name: {{ include "tigerbeetle.fullname" . }}-headless
  labels:
    {{- include "tigerbeetle.labels" . | nindent 4 }}
  {{- with .Values.service.headless.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: tigerbeetle
      port: {{ .Values.tigerbeetle.port }}
      targetPort: tigerbeetle
      protocol: TCP
  selector:
    {{- include "tigerbeetle.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tigerbeetle.fullname" . }}
  labels:
    {{- include "tigerbeetle.labels" . | nindent 4 }}
  {{- with .Values.service.client.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.client.type }}
  ports:
    - name: tigerbeetle
      port: {{ .Values.service.client.port }}
      targetPort: tigerbeetle
      protocol: TCP
  selector:
    {{- include "tigerbeetle.selectorLabels" . | nindent 4 }}
