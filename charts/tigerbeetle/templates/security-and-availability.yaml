{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tigerbeetle.serviceAccountName" . }}
  labels:
    {{- include "tigerbeetle.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
---
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tigerbeetle.fullname" . }}
  labels:
    {{- include "tigerbeetle.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "tigerbeetle.selectorLabels" . | nindent 6 }}
{{- end }}
---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tigerbeetle.fullname" . }}
  labels:
    {{- include "tigerbeetle.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tigerbeetle.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Same-namespace peer replication traffic.
    - from:
        - podSelector:
            matchLabels:
              {{- include "tigerbeetle.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.tigerbeetle.port }}
    # Approved finance-domain clients. Namespace labels must be managed by the platform team.
    - from:
        {{- range .Values.networkPolicy.allowedClientNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.tigerbeetle.port }}
  egress:
    # Allow only peer traffic and cluster DNS. Add backup endpoint rules after formal approval.
    - to:
        - podSelector:
            matchLabels:
              {{- include "tigerbeetle.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.tigerbeetle.port }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
