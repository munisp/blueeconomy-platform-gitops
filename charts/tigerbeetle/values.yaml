# Non-production-safe baseline. Production requires a separately reviewed values file.
nameOverride: ""
fullnameOverride: ""

image:
  repository: ""
  # Pin to an immutable digest after SBOM, vulnerability and compatibility approval.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# PROTECTED: Changing these after a cluster has been formatted is unsupported.
tigerbeetle:
  clusterID: ""
  replicaCount: 6
  port: 3000
  dataPath: /var/lib/tigerbeetle/data.tigerbeetle
  # Must match the ordered StatefulSet ordinal DNS names generated by this chart.
  peerAddressTemplate: "{{ include \"tigerbeetle.fullname\" . }}-%d.{{ include \"tigerbeetle.fullname\" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:3000"
  # The chart's initialization script prevents reformatting a non-empty volume.
  initialize: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  annotations: {}
  client:
    type: ClusterIP
    port: 3000
  headless:
    annotations: {}

persistence:
  enabled: true
  storageClass: ""
  accessModes: ["ReadWriteOncePod"]
  size: 100Gi
  annotations: {}
  # PVCs are intentionally retained. They must never be deleted automatically.
  retainOnDelete: true
  retainOnScale: true

resources:
  requests:
    cpu: "2"
    memory: 8Gi
  limits:
    cpu: "4"
    memory: 16Gi

nodeSelector:
  blueeconomy.platform/node-pool: financial-stateful
tolerations: []
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: tigerbeetle
        topologyKey: kubernetes.io/hostname
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: tigerbeetle

networkPolicy:
  enabled: true
  # Populate with allowed finance-domain namespaces/CIDRs in environment values.
  allowedClientNamespaces: ["blueeco-finance-prod"]
  allowedPeerNamespaces: ["blueeco-tigerbeetle-prod"]

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

monitoring:
  serviceMonitor:
    enabled: false
    labels: {}
  # A sidecar/exporter must be approved for the selected product release.
  metricsPort: 0

backup:
  # TigerBeetle ledger backup (GAP-PG-05). Design follows TigerBeetle's
  # documented backup approach — a storage-level (crash-consistent)
  # snapshot of one redundant replica's data file: every sector write is
  # checksummed by TigerBeetle, and on restore the replica recovers from
  # the last consistent checkpoint and replicates forward from the
  # quorum, which never stops (replicaCount >= 3 required).
  # Flow (scheduled Job): VolumeSnapshot of the replica PVC -> scratch
  # PVC from the snapshot -> verifier/uploader pod mounts it read-only,
  # emits a sha256 manifest and streams the gzip-compressed data file to
  # the immutable object-storage bucket -> scratch resources are cleaned
  # up.
  # NOT_RUN: implemented and render-gated, but never executed against a
  # live cluster. Enable only after an approved restore drill
  # (charts/backup-dr restoreTest harness) validates snapshot restore and
  # the tigerbeetle inspect/replication catch-up for the deployed TB
  # version; the restore procedure evidence lands in docs/dr-restore.md.
  enabled: false
  schedule: "0 2 * * *"
  # Redundant replica ordinal whose PVC is snapshotted (0-based; must be
  # < tigerbeetle.replicaCount).
  replicaOrdinal: 5
  # CSI VolumeSnapshotClass (must support crash-consistent snapshots).
  snapshotClassName: ""
  # Immutable object-storage target (S3-compatible, object-lock capable;
  # generic HTTPS endpoint — on-prem, sovereign or commercial cloud).
  storage:
    bucket: ""
    prefix: tigerbeetle
    endpoint: ""
    region: ""
    # ExternalSecrets-synced credentials Secret consumed via envFrom
    # (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY style keys).
    credentialsSecretRef:
      name: ""
  # Digest-pinned tooling images: kubectl for orchestration, an S3 client
  # image for the upload.
  kubectlImage:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  storageImage:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Backup Job pod egress: the Kubernetes API and the object-storage
  # endpoint CIDRs (both render-gated when enabled).
  network:
    apiServerCIDRs: []
    storageCIDRs: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

priorityClassName: "system-cluster-critical"
terminationGracePeriodSeconds: 120
