# Non-production-safe baseline. Production requires a separately reviewed values file.
nameOverride: ""
fullnameOverride: ""

image:
  repository: ""
  # Pin to an immutable digest after SBOM, vulnerability and compatibility approval.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# PROTECTED: Changing these after a cluster has been formatted is unsupported.
tigerbeetle:
  clusterID: ""
  replicaCount: 6
  port: 3000
  dataPath: /var/lib/tigerbeetle/data.tigerbeetle
  # Must match the ordered StatefulSet ordinal DNS names generated by this chart.
  peerAddressTemplate: "{{ include \"tigerbeetle.fullname\" . }}-%d.{{ include \"tigerbeetle.fullname\" . }}-headless.{{ .Release.Namespace }}.svc.cluster.local:3000"
  # The chart's initialization script prevents reformatting a non-empty volume.
  initialize: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  annotations: {}
  client:
    type: ClusterIP
    port: 3000
  headless:
    annotations: {}

persistence:
  enabled: true
  storageClass: ""
  accessModes: ["ReadWriteOncePod"]
  size: 100Gi
  annotations: {}
  # PVCs are intentionally retained. They must never be deleted automatically.
  retainOnDelete: true
  retainOnScale: true

resources:
  requests:
    cpu: "2"
    memory: 8Gi
  limits:
    cpu: "4"
    memory: 16Gi

nodeSelector:
  blueeconomy.platform/node-pool: financial-stateful
tolerations: []
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: tigerbeetle
        topologyKey: kubernetes.io/hostname
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: tigerbeetle

networkPolicy:
  enabled: true
  # Populate with allowed finance-domain namespaces/CIDRs in environment values.
  allowedClientNamespaces: ["blueeco-finance-prod"]
  allowedPeerNamespaces: ["blueeco-tigerbeetle-prod"]

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

monitoring:
  serviceMonitor:
    enabled: false
    labels: {}
  # A sidecar/exporter must be approved for the selected product release.
  metricsPort: 0

backup:
  enabled: false
  # Set true only after the selected TigerBeetle version's supported backup/recovery procedure is implemented.
  schedule: "0 2 * * *"
  externalSecretRef: ""

priorityClassName: "system-cluster-critical"
terminationGracePeriodSeconds: 120
