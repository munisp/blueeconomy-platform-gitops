# Grafana Loki log backend. Object storage is REQUIRED; credentials via
# ExternalSecrets only. Cloud-agnostic S3-compatible API.
nameOverride: ""
fullnameOverride: ""

# Deployment profile (dev | staging | prod).
profile: ""

image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

replicas: 1

# Log retention, render-gated to the approved 7-30 day band
# (OTEL_DESIGN.md section 1).
retentionHours: 720

# Trace<->log correlation contract (section 3 of the production gate):
# every shipped log line carries these fields; they are stored as Loki
# structured metadata so a Tempo trace pivots to its logs (and back).
# The app logging layer emits them; this chart render-gates the contract
# so it can never be silently weakened. Required: trace_id AND span_id.
correlation:
  requiredFields:
    - trace_id
    - span_id

# S3-compatible storage backend (REQUIRED contract).
storage:
  bucket: ""
  # HTTPS endpoint of the S3-compatible store.
  endpoint: ""
  region: ""
  accessKeySecretKey: LOKI_S3_ACCESS_KEY
  secretKeySecretKey: LOKI_S3_SECRET_KEY

# Local boltdb-shipper/tsdb cache + WAL volume (PVC).
persistence:
  storageClassName: ""
  size: ""
  accessModes:
    - ReadWriteOnce

# ExternalSecrets contract (any ESO-supported ClusterSecretStore).
externalSecrets:
  storeRef:
    name: ""
    kind: ClusterSecretStore
  refreshInterval: 1h
  keys: {}

resources:
  requests:
    cpu: ""
    memory: ""
  limits:
    cpu: ""
    memory: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

podDisruptionBudget:
  enabled: true
  # Singleton monolith: voluntary disruption requires an approved operator
  # action.
  maxUnavailable: 0

networkPolicy:
  enabled: true
  # Object-storage egress CIDRs (HTTPS 443); render-gated non-empty.
  storageCIDRs: []

serviceMonitor:
  enabled: true
  labels:
    blueeconomy.platform/workstream: observability
