apiVersion: v2
name: tax-stamps
description: >-
  blueeconomy-tax-stamps: the revenue-critical electronic tax-stamp
  service (Python/FastAPI, PostgreSQL-backed with Alembic migrations,
  Redis velocity/nonce guards, Kafka outbox/inbox, PBAC policy engine,
  Ed25519 stamp signing, OIDC bearer authn). Deploys the four fail-closed
  processes of the single image (taxstamps-api, taxstamps-consumer,
  taxstamps-outbox, taxstamps-expiry-sweeper). Fail-closed: digest-pinned
  image, all credentials via ExternalSecrets, the signing key mounted from
  the synced Secret (never inline), TAXSTAMPS_TEST_* env refused in the
  prod profile, resources required, PodSecurity restricted.
  Cloud-agnostic: no provider API is consumed.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - revenue
  - tax-stamps
  - payments
  - blue-economy
annotations:
  blueeconomy.platform/criticality: "revenue-critical"
  blueeconomy.platform/upstream-policy: "Pin verified upstream image digests; do not deploy unreviewed defaults"
