# tax-stamps network posture: ingress from the APISIX edge namespace only
# (plus same-namespace traffic); egress to PostgreSQL 5432, Kafka 9092,
# Redis 6379, Keycloak 443 (JWKS), the financial-controls payment rail and
# DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tax-stamps.fullname" . }}
  labels:
    {{- include "tax-stamps.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tax-stamps.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.apisixNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "tax-stamps.selectorLabels" . | nindent 14 }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.postgresNamespace | quote }}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.kafkaNamespace | quote }}
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.redisNamespace | quote }}
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.keycloakNamespace | quote }}
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.financialControlsNamespace | quote }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
