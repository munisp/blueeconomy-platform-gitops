{{- $fullName := include "keycloak-realms.fullname" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullName }}-import
  labels:
    {{- include "keycloak-realms.labels" . | nindent 4 }}
  annotations:
    # Realm import is idempotent; client secrets are left untouched thanks to
    # the "*********" sentinel, so re-running on sync is safe.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.importJob.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-realms
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: realm-import
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: keycloak-config-cli
          image: {{ printf "%s@%s" .Values.importJob.repository .Values.importJob.digest | quote }}
          imagePullPolicy: {{ .Values.importJob.pullPolicy }}
          args:
            - --import.files.locations=/config/realms
          env:
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.baseUrl | quote }}
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminCredentials.secretName | quote }}
                  key: {{ .Values.adminCredentials.userKey | quote }}
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.adminCredentials.secretName | quote }}
                  key: {{ .Values.adminCredentials.passwordKey | quote }}
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: IMPORT_FILES_LOCATIONS
              value: /config/realms
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: realms
              mountPath: /config/realms
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: realms
          projected:
            sources:
              {{- range $realm := .Values.realms }}
              - configMap:
                  name: keycloak-realm-{{ $realm.name }}
              {{- end }}
        - name: tmp
          emptyDir: {}
---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "keycloak-realms.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-realms
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Keycloak service within this namespace only.
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8080
{{- end }}
