{{- if .Values.externalSecrets.keys }}
# Keycloak admin credentials for the realm-import Job.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "keycloak-realms.fullname" . }}-admin
  labels:
    {{- include "keycloak-realms.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.storeRef.name is required" .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ .Values.adminCredentials.secretName }}
    creationPolicy: Owner
  data:
    {{- range $key, $remoteKey := .Values.externalSecrets.keys }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ $remoteKey | quote }}
    {{- end }}
{{- end }}
{{- range $realm := .Values.realms }}
{{- $ws := trimPrefix "blueeconomy-" $realm.workstreamNamespace }}
{{- range $client := $realm.clients }}
{{- $remoteKey := default (printf "%s/clients/%s-secret" $ws $client.clientId) $client.secretRemoteKey }}
---
# Confidential client {{ $client.clientId }} (realm {{ $realm.name }}).
# The secret object is created/rotated in Azure Key Vault by the identity
# team; this ExternalSecret is the ONLY delivery path into the cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-client-{{ $client.clientId }}
  namespace: {{ $realm.workstreamNamespace }}
  labels:
    {{- include "keycloak-realms.labels" $ | nindent 4 }}
    blueeconomy.platform/realm: {{ $realm.name | quote }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.storeRef.name is required" $.Values.externalSecrets.storeRef.name }}
    kind: {{ $.Values.externalSecrets.storeRef.kind }}
  target:
    name: keycloak-client-{{ $client.clientId }}
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: {{ $remoteKey | quote }}
{{- end }}
{{- end }}
