{{- $fullName := include "financial-controls.fullname" . -}}
{{- range $name, $component := .Values.components }}
{{- if and $component.enabled $component.service $component.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" $fullName $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "financial-controls.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name | quote }}
spec:
  type: {{ $component.service.type }}
  ports:
    - name: http
      port: {{ $component.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "financial-controls.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name | quote }}
{{- end }}
{{- end }}
