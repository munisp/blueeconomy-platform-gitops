# Martin configuration: connection DSN from the synced Secret, tile
# functions published per values. Rendered as a ConfigMap consumed via
# martin --config; the DSN itself is injected as $DATABASE_URL from the
# Secret (Martin expands env references in the config file).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "martin.fullname" . }}-config
  labels:
    {{- include "martin.labels" . | nindent 4 }}
immutable: true
data:
  config.yaml: |
    listen_addresses: "0.0.0.0:{{ .Values.port }}"
    worker_processes: 4
    postgres:
      connection_string: "$DATABASE_URL"
      auto_publish: false
      functions:
        {{- range $f := .Values.postgres.tileFunctions }}
        {{ $f.name }}:
          schema: {{ $f.schema | quote }}
          function: {{ $f.name | quote }}
          minzoom: {{ $f.minzoom | default 0 }}
          maxzoom: {{ $f.maxzoom | default 22 }}
        {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "martin.fullname" . }}
  labels:
    {{- include "martin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "martin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "martin.selectorLabels" . | nindent 8 }}
        blueeconomy.platform/geo-postgis-client: "true"
      annotations:
        # The edge route this release is registered under (render-gated).
        blueeconomy.platform/edge-route: {{ .Values.edge.routeRegistration.apisixRouteRef | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: martin
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/martin/config.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.dsnSecretRef.name }}
                  key: {{ .Values.postgres.dsnSecretRef.key }}
          volumeMounts:
            - name: config
              mountPath: /etc/martin
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: {{ include "martin.fullname" . }}-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "martin.fullname" . }}
  labels:
    {{- include "martin.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "martin.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
