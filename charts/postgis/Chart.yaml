apiVersion: v2
name: postgis
description: >-
  PostgreSQL 15 + PostGIS hot-path store for the geospatial stack
  (docs/geo-deployment.md, GEO_ARCHITECTURE D1). Render-gated image enum:
  cloudnative-pg (CloudNativePG Cluster CR on the ghcr.io/cloudnative-pg/postgis
  operand) or postgis-image (plain StatefulSet on postgis/postgis:15-3.5) —
  both digest-pinned, both cloud-agnostic (any conformant Kubernetes storage
  class, no provider API). Fail-closed: image digests must be immutable
  sha256, storage size/class and the credentials secret reference are
  required, inline passwords are refused, and backup wiring must match the
  charts/backup-dr WAL-G contract (storage.provider honoured).
type: application
version: 0.1.0
appVersion: "15-3.5"
kubeVersion: ">=1.28.0-0"
keywords:
  - postgis
  - postgresql
  - geospatial
  - blue-economy
annotations:
  blueeconomy.platform/criticality: "geo-hot-path"
  blueeconomy.platform/upstream-policy: "Pin verified upstream image digests; do not deploy unreviewed defaults"
