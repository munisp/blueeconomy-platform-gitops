# Default-deny for the PostGIS pods plus the only approved openings:
# 5432 from the geo-service/martin namespaces and DNS egress. Cilium
# geo-namespace policies (charts/cilium networkPolicies.geo) mirror this at
# the eBPF layer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "postgis.fullname" . }}
  labels:
    {{- include "postgis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "postgis.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    {{- range $ns := .Values.networkPolicy.allowedClientNamespaces }}
    - from:
        # namespaceSelector AND podSelector in a single item: both must match.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns | quote }}
          {{- with $.Values.networkPolicy.allowedClientPodLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
