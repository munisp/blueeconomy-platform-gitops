{{- if eq .Values.image.variant "cloudnative-pg" }}
# CloudNativePG variant: the operator (source-locked in
# components/upstream-components.lock.yaml) reconciles this Cluster onto the
# ghcr.io/cloudnative-pg/postgis operand. Runs on any conformant Kubernetes
# storage class — no provider API.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "postgis.fullname" . }}
  labels:
    {{- include "postgis.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cluster.instances }}
  imageName: {{ include "postgis.imageRef" . | quote }}
  imagePullPolicy: {{ .Values.image.pullPolicy }}
  superuserSecret:
    name: {{ .Values.credentialsSecretRef.name }}
  enableSuperuserAccess: true
  bootstrap:
    initdb:
      database: {{ .Values.database.name }}
      owner: {{ .Values.database.appRole }}
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS postgis;
        - CREATE EXTENSION IF NOT EXISTS postgis_topology;
        - CREATE EXTENSION IF NOT EXISTS btree_gist;
        # RANGE-partitioned ais_positions (BRIN ts, GiST geom on the hot
        # partition), vessels_static SCD-2 and latest_positions upserts are
        # created by the geo-service migrations (db/migrations/0001..), not
        # by this chart.
  storage:
    size: {{ .Values.storage.size | quote }}
    storageClass: {{ .Values.storage.storageClass | quote }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
  {{- if .Values.backup.enabled }}
  # WAL-G archive-side env rendered by charts/backup-dr, honouring the
  # environment's storage.provider ({{ .Values.backup.storageProvider }}).
  envFrom:
    - configMapRef:
        name: {{ .Values.backup.walGEnvConfigMapRef }}
    - secretRef:
        name: {{ .Values.credentialsSecretRef.name }}
  {{- end }}
  monitoring:
    enablePodMonitor: false
{{- else }}
# postgis-image variant: plain StatefulSet on postgis/postgis:15-3.5 (no
# operator dependency). PodSecurity restricted; credentials only from the
# ExternalSecrets-synced Secret — never inline.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgis.fullname" . }}
  labels:
    {{- include "postgis.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "postgis.fullname" . }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "postgis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postgis.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: postgis
          image: {{ include "postgis.imageRef" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecretRef.name }}
                  key: {{ .Values.credentialsSecretRef.usernameKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecretRef.name }}
                  key: {{ .Values.credentialsSecretRef.passwordKey }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          {{- if .Values.backup.enabled }}
          envFrom:
            # WAL-G archive-side env rendered by charts/backup-dr, honouring
            # the environment's storage.provider
            # ({{ .Values.backup.storageProvider }}).
            - configMapRef:
                name: {{ .Values.backup.walGEnvConfigMapRef }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", {{ .Values.database.name | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", {{ .Values.database.name | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.storage.size | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgis.fullname" . }}-headless
  labels:
    {{- include "postgis.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "postgis.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
{{- end }}
---
# Client-facing Service. CloudNativePG renders its own -rw service from the
# Cluster CR; this Service fronts both variants with a stable name consumed
# by geo-service/martin DSN secrets and the Cilium geo policies.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgis.fullname" . }}
  labels:
    {{- include "postgis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "postgis.selectorLabels" . | nindent 4 }}
    {{- if eq .Values.image.variant "cloudnative-pg" }}
    cnpg.io/cluster: {{ include "postgis.fullname" . }}
    role: primary
    {{- end }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
