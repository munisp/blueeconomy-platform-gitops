apiVersion: v2
name: caddy
description: >-
  Caddy TLS-terminating edge in front of the APISIX gateway, promoted from
  the umbrella design-stage kustomize into a render-gated Argo-managed chart.
  Automated TLS (internal CA or ACME with the Azure DNS solver abstraction),
  mandatory security headers, request-size and timeout caps, edge mTLS for
  partner/NSW routes, and the OpenAppSec WAF contract flag. Fail-closed:
  domain names, upstream service names, image digest and the OIDC discovery
  URL are required.
type: application
version: 0.1.0
appVersion: "2.8.4"
kubeVersion: ">=1.28.0-0"
keywords:
  - caddy
  - edge
  - tls
  - waf
  - blue-economy
annotations:
  blueeconomy.platform/criticality: "public-edge"
  blueeconomy.platform/upstream-policy: "Pin verified upstream image digests; do not deploy unreviewed defaults"
