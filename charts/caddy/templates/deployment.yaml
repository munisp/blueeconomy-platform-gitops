apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-edge
  labels:
    {{- include "caddy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "caddy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "caddy.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "caddy.serviceAccountName" . }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - containerPort: 443
              name: https
          {{- if eq .Values.tls.mode "acme" }}
          {{- if eq .Values.tls.acme.dnsProvider.name "rfc2136" }}
          env:
            - name: RFC2136_NAMESERVER
              value: {{ .Values.tls.acme.dnsProvider.rfc2136.nameserver | quote }}
          envFrom:
            # RFC 2136 TSIG credentials (RFC2136_TSIG_*), synced from the
            # landing zone's secret store by the ExternalSecret in
            # externalsecret.yaml.
            - secretRef:
                name: {{ .Values.tls.acme.dnsProvider.rfc2136.tsigSecretRef.name }}
          {{- else if has .Values.tls.acme.dnsProvider.name (list "azuredns" "route53" "cloudflare" "googleclouddns" "digitalocean") }}
          envFrom:
            # DNS-01 provider API credentials, synced from the landing
            # zone's secret store by the ExternalSecret in
            # externalsecret.yaml.
            - secretRef:
                name: {{ .Values.tls.acme.dnsProvider.credentialsSecretRef.name }}
          {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: partner-ca
              mountPath: /etc/caddy/partner-ca
              readOnly: true
            {{- if and (eq .Values.tls.mode "acme") (has .Values.tls.acme.dnsProvider.name (list "internal-ca" "manual")) }}
            - name: tls
              mountPath: /etc/caddy/tls
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "caddy.fullname" . }}-config
        - name: partner-ca
          secret:
            secretName: {{ .Values.tls.partnerMtls.caSecretRef.name }}
        {{- if and (eq .Values.tls.mode "acme") (has .Values.tls.acme.dnsProvider.name (list "internal-ca" "manual")) }}
        - name: tls
          secret:
            # internal-ca: cert-manager Certificate output (certificate.yaml);
            # manual: the operator-supplied TLS Secret.
            secretName: {{ ternary (printf "%s-edge-tls" (include "caddy.fullname" .)) .Values.tls.acme.dnsProvider.manual.tlsSecretRef.name (eq .Values.tls.acme.dnsProvider.name "internal-ca") }}
        {{- end }}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: caddy-edge
  labels:
    {{- include "caddy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "caddy.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "caddy.serviceAccountName" . }}
  labels:
    {{- include "caddy.labels" . | nindent 4 }}
{{- end }}
