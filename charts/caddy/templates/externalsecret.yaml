{{- if .Values.externalSecrets.keys }}
# DNS-01 solver credentials for the selected tls.acme.dnsProvider, synced
# from the sovereign landing zone's secret store (any ESO-supported
# ClusterSecretStore: Azure Key Vault, HashiCorp Vault, or another provider;
# selection is deployment policy). This is the sole delivery path for edge
# credentials; nothing is authored in-cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "caddy.fullname" . }}-acme-dns
  labels:
    {{- include "caddy.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    # rfc2136 syncs into the TSIG Secret; the API-token providers sync into
    # credentialsSecretRef. internal-ca / manual declare no keys.
    name: {{ ternary .Values.tls.acme.dnsProvider.rfc2136.tsigSecretRef.name .Values.tls.acme.dnsProvider.credentialsSecretRef.name (eq .Values.tls.acme.dnsProvider.name "rfc2136") }}
    creationPolicy: Owner
  data:
    {{- range $key, $remoteKey := .Values.externalSecrets.keys }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ $remoteKey | quote }}
    {{- end }}
{{- end }}
