{{- if .Values.externalSecrets.keys }}
# Azure DNS solver credentials for ACME DNS-01, synced from Azure Key Vault
# (Azure Government: vault.usgovcloudapi.net ClusterSecretStore). This is the
# sole delivery path for edge credentials; nothing is authored in-cluster.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "caddy.fullname" . }}-acme-dns
  labels:
    {{- include "caddy.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ .Values.tls.acme.dnsProvider.credentialsSecretRef.name }}
    creationPolicy: Owner
  data:
    {{- range $key, $remoteKey := .Values.externalSecrets.keys }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ $remoteKey | quote }}
    {{- end }}
{{- end }}
