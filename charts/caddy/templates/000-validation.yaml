{{- /* Fail-closed approval gates for the Caddy edge. */ -}}
{{- /* Metrics honesty gate (PRA-066): the ServiceMonitor requires the
       metrics endpoint it scrapes (admin endpoint bound off-loopback and
       exposed on the Service). */ -}}
{{- if and .Values.serviceMonitor.enabled (not .Values.metrics.enabled) -}}
{{- fail "serviceMonitor.enabled=true requires metrics.enabled=true (the Caddy admin /metrics endpoint must be bound and exposed; never wire a scrape target the endpoint does not serve)" -}}
{{- end -}}
{{- $digest := required "image.digest is required" .Values.image.digest -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) -}}
{{- fail "image.digest must be an immutable lower-case sha256 digest" -}}
{{- end -}}
{{- $repo := required "image.repository is required (approved Caddy build with the DNS-01 provider modules and rate_limit module)" .Values.image.repository -}}

{{- $dnsName := "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$" -}}
{{- $publicHost := required "domains.publicHost is required (public edge hostname)" .Values.domains.publicHost -}}
{{- if not (regexMatch $dnsName $publicHost) -}}
{{- fail "domains.publicHost must be a DNS hostname" -}}
{{- end -}}
{{- $adminHost := required "domains.adminHost is required (management-network admin hostname)" .Values.domains.adminHost -}}
{{- if not (regexMatch $dnsName $adminHost) -}}
{{- fail "domains.adminHost must be a DNS hostname" -}}
{{- end -}}
{{- if eq $publicHost $adminHost -}}
{{- fail "domains.publicHost and domains.adminHost must be distinct listeners" -}}
{{- end -}}

{{- $upstreamRe := "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?:[0-9]+$" -}}
{{- $apisix := required "upstreams.apisix.address is required (APISIX gateway host:port)" .Values.upstreams.apisix.address -}}
{{- if not (regexMatch $upstreamRe $apisix) -}}
{{- fail "upstreams.apisix.address must be an in-cluster host:port" -}}
{{- end -}}
{{- $apisixAdmin := required "upstreams.apisixAdmin.address is required (APISIX admin host:port)" .Values.upstreams.apisixAdmin.address -}}
{{- if not (regexMatch $upstreamRe $apisixAdmin) -}}
{{- fail "upstreams.apisixAdmin.address must be an in-cluster host:port" -}}
{{- end -}}

{{- if not (has .Values.tls.mode (list "acme" "internal")) -}}
{{- fail "tls.mode must be acme or internal" -}}
{{- end -}}
{{- if eq .Values.tls.mode "acme" -}}
{{- /* Provider-neutral issuance enum. ACME DNS-01 solvers work against any
       standards-compliant or cloud DNS; internal-ca and manual are the
       no-ACME issuance paths. Azure DNS is one supported option among
       several, never a requirement. New providers are added ONLY as new
       render-gated enum members (docs/cloud-agnosticism.md). */ -}}
{{- $acmeDnsProviders := list "rfc2136" "azuredns" "route53" "cloudflare" "googleclouddns" "digitalocean" -}}
{{- $providers := list "rfc2136" "azuredns" "route53" "cloudflare" "googleclouddns" "digitalocean" "internal-ca" "manual" -}}
{{- $provider := .Values.tls.acme.dnsProvider.name -}}
{{- if not (has $provider $providers) -}}
{{- fail "tls.acme.dnsProvider.name must be one of: rfc2136, azuredns, route53, cloudflare, googleclouddns, digitalocean, internal-ca, manual" -}}
{{- end -}}
{{- if has $provider $acmeDnsProviders -}}
{{- $email := required "tls.acme.email is required for ACME DNS-01 providers" .Values.tls.acme.email -}}
{{- if not (contains "@" $email) -}}
{{- fail "tls.acme.email must be an email address" -}}
{{- end -}}
{{- if eq $provider "rfc2136" -}}
{{- $nameserver := required "tls.acme.dnsProvider.rfc2136.nameserver is required for provider=rfc2136 (host:port of the authoritative DNS server accepting RFC 2136 dynamic updates)" .Values.tls.acme.dnsProvider.rfc2136.nameserver -}}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9.]*[a-z0-9])?:[0-9]+$" $nameserver) -}}
{{- fail "tls.acme.dnsProvider.rfc2136.nameserver must be a host:port" -}}
{{- end -}}
{{- $tsig := required "tls.acme.dnsProvider.rfc2136.tsigSecretRef.name is required for provider=rfc2136 (TSIG key Secret synced from the landing zone's secret store)" .Values.tls.acme.dnsProvider.rfc2136.tsigSecretRef.name -}}
{{- else -}}
{{- $cred := required (printf "tls.acme.dnsProvider.credentialsSecretRef.name is required for provider=%s (ExternalSecret-synced DNS API credentials)" $provider) .Values.tls.acme.dnsProvider.credentialsSecretRef.name -}}
{{- end -}}
{{- else if eq $provider "internal-ca" -}}
{{- $issuer := required "tls.acme.dnsProvider.internalCA.issuerRef.name is required for provider=internal-ca (cert-manager issuer for the edge Certificate)" .Values.tls.acme.dnsProvider.internalCA.issuerRef.name -}}
{{- if not (has .Values.tls.acme.dnsProvider.internalCA.issuerRef.kind (list "Issuer" "ClusterIssuer")) -}}
{{- fail "tls.acme.dnsProvider.internalCA.issuerRef.kind must be Issuer or ClusterIssuer" -}}
{{- end -}}
{{- else -}}
{{- $tlsSecret := required "tls.acme.dnsProvider.manual.tlsSecretRef.name is required for provider=manual (operator-supplied TLS Secret)" .Values.tls.acme.dnsProvider.manual.tlsSecretRef.name -}}
{{- end -}}
{{- end -}}
{{- $partnerCA := required "tls.partnerMtls.caSecretRef.name is required (partner CA bundle for /partner and /v1/nsw edge mTLS)" .Values.tls.partnerMtls.caSecretRef.name -}}

{{- if not .Values.openappsec.required -}}
{{- fail "openappsec.required must remain true (OpenAppSec WAF contract flag; see charts/mojaloop-overlay)" -}}
{{- end -}}

{{- $discovery := required "keycloak.discoveryUrl is required (OIDC RP discovery for admin consoles)" .Values.keycloak.discoveryUrl -}}
{{- if not (hasPrefix "https://" $discovery) -}}
{{- fail "keycloak.discoveryUrl must be an HTTPS URL" -}}
{{- end -}}

{{- $maxBody := int .Values.security.maxBodySizeMB -}}
{{- if or (le $maxBody 0) (gt $maxBody 2) -}}
{{- fail "security.maxBodySizeMB must be between 1 and 2 (the approved edge body cap is 2MB)" -}}
{{- end -}}
{{- $events := int .Values.security.rateLimit.events -}}
{{- if or (le $events 0) (gt $events 60) -}}
{{- fail "security.rateLimit.events must be between 1 and 60 per window (the approved coarse edge ceiling is 60/min)" -}}
{{- end -}}
{{- if le (int .Values.security.rateLimit.windowSeconds) 0 -}}
{{- fail "security.rateLimit.windowSeconds must be positive" -}}
{{- end -}}
{{- if le (int .Values.security.proxy.readTimeoutSeconds) 0 -}}
{{- fail "security.proxy.readTimeoutSeconds must be positive" -}}
{{- end -}}
{{- if le (int .Values.security.proxy.writeTimeoutSeconds) 0 -}}
{{- fail "security.proxy.writeTimeoutSeconds must be positive" -}}
{{- end -}}

{{- if .Values.externalSecrets.keys -}}
{{- $store := required "externalSecrets.storeRef.name is required when externalSecrets.keys are declared" .Values.externalSecrets.storeRef.name -}}
{{- end -}}
