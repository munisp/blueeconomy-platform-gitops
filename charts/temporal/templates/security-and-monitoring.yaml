{{- if .Values.externalSecrets.keys }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "temporal.fullname" . }}-credentials
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.storeRef.name is required" .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ required "persistence.credentialsSecretName is required" .Values.persistence.credentialsSecretName }}
    creationPolicy: Owner
  data:
    {{- range $key, $remoteKey := .Values.externalSecrets.keys }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ $remoteKey | quote }}
    {{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "temporal.fullname" . }}
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "temporal.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "temporal.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.server.frontendPort }}
    # Approved workstream workers (cvff, ferries, ports) poll the frontend.
    {{- range .Values.networkPolicy.allowedWorkerNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.server.frontendPort }}
    {{- end }}
    # Prometheus metrics scraping from the platform namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: blueeconomy-platform
      ports:
        - protocol: TCP
          port: {{ .Values.server.metricsPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL persistence within this namespace (CloudNativePG).
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.persistence.port }}
{{- end }}
{{- if .Values.monitoring.podMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "temporal.fullname" . }}
  labels:
    {{- include "temporal.labels" . | nindent 4 }}
    {{- with .Values.monitoring.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "temporal.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
{{- end }}
