# Gateway network posture: AIS/sensor feed ingress from the approved edge
# bridge namespaces only; egress to the Kafka/Fluvio uplink namespace and
# DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "waterway-safety.fullname" . }}
  labels:
    {{- include "waterway-safety.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "waterway-safety.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    {{- range .Values.networkPolicy.allowedIngressNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.ports.ais }}
        - protocol: TCP
          port: {{ $.Values.ports.sensor }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.uplinkNamespace | quote }}
      ports:
        - protocol: TCP
          port: 9092
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
