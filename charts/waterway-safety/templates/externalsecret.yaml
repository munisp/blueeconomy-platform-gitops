{{- if .Values.externalSecrets.keys }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "waterway-safety.secretName" . }}
  labels:
    {{- include "waterway-safety.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.storeRef.name is required" .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ include "waterway-safety.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $envName, $remoteKey := .Values.externalSecrets.keys }}
    - secretKey: {{ $envName | quote }}
      remoteRef:
        key: {{ $remoteKey | quote }}
    {{- end }}
{{- end }}
