apiVersion: v2
name: waterway-safety
description: >-
  blueeconomy-waterway-safety gateway (Rust): the telemetry-integrity
  gateway for the waterway-safety capability. AIS NMEA 0183 and LoRaWAN
  sensor uplinks arrive over TCP JSON-lines bridges, are normalized into
  TelemetryFrames, journaled to an append-only bounded store (durable
  across uplink outages) and forwarded to the ferries.telemetry.v1 topic
  via the configured uplink transport (fluvio|kafka, config-only swap).
  Every batch is Ed25519 provenance-signed; the binary refuses to start
  without PROVENANCE_SIGNING_KEY. Deployed as a single-replica
  StatefulSet: the journal is per-gateway durable state. Fail-closed:
  digest-pinned image, signing key via ExternalSecrets only, resources
  required, PodSecurity restricted.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - waterway-safety
  - telemetry
  - edge-gateway
  - blue-economy
annotations:
  blueeconomy.platform/criticality: "safety-telemetry"
  blueeconomy.platform/upstream-policy: "Pin verified upstream image digests; do not deploy unreviewed defaults"
