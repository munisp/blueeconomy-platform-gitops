apiVersion: v2
name: insurance
description: >-
  blueeconomy-insurance: the marine insurance engine (Python/FastAPI,
  PostgreSQL-backed with Alembic migrations, VC-based Ed25519-signed
  policies, deterministic server-side rating, double-entry claims,
  Kafka transactional outbox, PBAC policy engine, OIDC bearer authn,
  fail-closed partner-insurer adapters and digest-pinned ISR evidence).
  Deploys the two fail-closed processes of the single image
  (insurance-api, insurance-outbox). Fail-closed: digest-pinned image,
  all credentials via ExternalSecrets, the signing key mounted from the
  synced Secret (never inline), partner adapter tokens referenced by env
  name only (never inline), ISR evidence sources digest-pinned, resources
  required, PodSecurity restricted. Cloud-agnostic: no provider API is
  consumed.
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - insurance
  - marine
  - verifiable-credentials
  - blue-economy
annotations:
  blueeconomy.platform/criticality: "revenue-adjacent"
  blueeconomy.platform/upstream-policy: "Pin verified upstream image digests; do not deploy unreviewed defaults"
