{{- range $name, $component := .Values.components }}
{{- if $component.enabled }}
{{- $digest := required (printf "%s.image.digest is required" $name) $component.image.digest -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) -}}
{{- fail (printf "%s.image.digest must be an immutable lower-case sha256 digest (no tag-only or :latest references)" $name) -}}
{{- end -}}
{{- $repository := required (printf "%s.image.repository is required" $name) $component.image.repository -}}
{{- $env := default dict $component.env -}}
{{- range $envName := (default (list) $component.requiredEnv) -}}
{{- if eq (printf "%v" (get $env $envName)) "" -}}
{{- fail (printf "%s.%s must be set to an approved environment value" $name $envName) -}}
{{- end -}}
{{- end -}}
{{- range $secretName := (default (list) $component.secretEnv) -}}
{{- if not (hasKey $.Values.externalSecrets.keys $secretName) -}}
{{- fail (printf "externalSecrets.keys.%s is required because %s consumes it via secretEnv" $secretName $name) -}}
{{- end -}}
{{- end -}}
{{- range $secretKey := (dig "secretMount" "keys" (list) $component) -}}
{{- if not (hasKey $.Values.externalSecrets.keys $secretKey) -}}
{{- fail (printf "externalSecrets.keys.%s is required because %s mounts it via secretMount" $secretKey $name) -}}
{{- end -}}
{{- end -}}
{{- /* OIDC discipline: the issuer and JWKS endpoints are HTTPS only. */ -}}
{{- if hasKey $env "FISHERIES_OIDC_JWKS_URL" -}}
{{- if and (ne (printf "%v" (get $env "FISHERIES_OIDC_JWKS_URL")) "") (not (hasPrefix "https://" (printf "%v" (get $env "FISHERIES_OIDC_JWKS_URL")))) -}}
{{- fail (printf "%s.FISHERIES_OIDC_JWKS_URL must be an HTTPS URL" $name) -}}
{{- end -}}
{{- end -}}
{{- if hasKey $env "FISHERIES_OIDC_ISSUER" -}}
{{- if and (ne (printf "%v" (get $env "FISHERIES_OIDC_ISSUER")) "") (not (hasPrefix "https://" (printf "%v" (get $env "FISHERIES_OIDC_ISSUER")))) -}}
{{- fail (printf "%s.FISHERIES_OIDC_ISSUER must be an HTTPS URL" $name) -}}
{{- end -}}
{{- end -}}
{{- /* Cold-chain breach-alert KPI: the detector SLA may never exceed the
       approved 60-second platform KPI, regardless of environment values. */ -}}
{{- if hasKey $env "FISHERIES_BREACH_ALERT_SLA_SECONDS" -}}
{{- if gt (int (get $env "FISHERIES_BREACH_ALERT_SLA_SECONDS")) 60 -}}
{{- fail (printf "%s.FISHERIES_BREACH_ALERT_SLA_SECONDS must be 60 seconds or less (cold-chain breach-alert platform KPI)" $name) -}}
{{- end -}}
{{- end -}}
{{- /* Fee settlement discipline: Mojaloop callouts are HTTPS only. */ -}}
{{- if hasKey $env "FISHERIES_MOJALOOP_BASE_URL" -}}
{{- if and (ne (printf "%v" (get $env "FISHERIES_MOJALOOP_BASE_URL")) "") (not (hasPrefix "https://" (printf "%v" (get $env "FISHERIES_MOJALOOP_BASE_URL")))) -}}
{{- fail (printf "%s.FISHERIES_MOJALOOP_BASE_URL must be an HTTPS URL (FSPIOP-signed fee settlement)" $name) -}}
{{- end -}}
{{- end -}}
{{- end }}
{{- end }}
{{- $store := required "externalSecrets.storeRef.name is required" .Values.externalSecrets.storeRef.name -}}
