{{- $fullName := include "agency-sandbox.fullname" . -}}
{{- $secretName := include "agency-sandbox.secretName" . -}}
{{- range $name, $agency := .Values.agencies }}
{{- if $agency.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" $fullName $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "agency-sandbox.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name | quote }}
spec:
  replicas: {{ $agency.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "agency-sandbox.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name | quote }}
  template:
    metadata:
      labels:
        {{- include "agency-sandbox.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name | quote }}
          image: "{{ $agency.image.repository }}@{{ $agency.image.digest }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $.Values.port }}
              protocol: TCP
          env:
            # Binary contract (internal/sandbox/sandbox.go): ADDR,
            # SANDBOX_SIGNING_PRIVATE_KEY (+ EPOCH), SANDBOX_TRUST_KEYS,
            # SANDBOX_TOKEN — nothing else is injected.
            - name: ADDR
              value: {{ printf ":%d" (int $.Values.port) | quote }}
            - name: SANDBOX_SIGNING_KEY_EPOCH
              value: {{ $agency.epoch | quote }}
            - name: SANDBOX_SIGNING_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName | quote }}
                  key: {{ $agency.agencySecretKey | quote }}
            {{- if $.Values.tokenSecretKey }}
            - name: SANDBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName | quote }}
                  key: {{ $.Values.tokenSecretKey | quote }}
            {{- end }}
            {{- range $key, $value := (default dict $.Values.env) }}
            - name: {{ $key | quote }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml $agency.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ $.Values.probes.livenessPath }}
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: {{ $.Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $.Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-%s" $fullName $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "agency-sandbox.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name | quote }}
spec:
  type: ClusterIP
  selector:
    {{- include "agency-sandbox.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name | quote }}
  ports:
    - name: http
      port: {{ $.Values.port }}
      targetPort: http
{{- end }}
{{- end }}
