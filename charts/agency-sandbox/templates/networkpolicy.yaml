# agency-sandbox network posture: ingress from the singlewindow platform
# adapter namespace only (the only legitimate caller) plus same-release
# traffic; egress to DNS only — the simulators make no outbound calls.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agency-sandbox.fullname" . }}
  labels:
    {{- include "agency-sandbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agency-sandbox.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.singlewindowNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.port }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "agency-sandbox.selectorLabels" . | nindent 14 }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
