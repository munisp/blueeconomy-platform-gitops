{{- $fullName := include "otel-collector-agent.fullname" . -}}
{{- $secretName := include "otel-collector-agent.secretName" . -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "otel-collector-agent.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 5
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "otel-collector-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "otel-collector-agent.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: otel-collector
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/otelcol-contrib", "--config", "/etc/otelcol/collector.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
          env:
            # Infra receiver credentials from the synced Secret (never
            # inline); mapped to the ${env:...} references in the config.
            {{- range $i, $db := .Values.receivers.postgresql.databases }}
            - name: {{ printf "PG_PASSWORD_%d" $i | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName | quote }}
                  key: {{ $db.passwordSecretKey | quote }}
            {{- end }}
            {{- if and .Values.receivers.redis.enabled .Values.receivers.redis.passwordSecretKey }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName | quote }}
                  key: {{ .Values.receivers.redis.passwordSecretKey | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # The collector has no HTTP health endpoint by default; probes
          # are TCP socket checks against the OTLP gRPC listener.
          startupProbe:
            tcpSocket:
              port: otlp-grpc
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: otlp-grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: otlp-grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $fullName }}
        - name: tmp
          emptyDir: {}
---
# Cluster-local OTLP ingestion endpoint for workloads (and the Dapr
# sidecar tracing configuration).
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "otel-collector-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "otel-collector-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: metrics
      port: 8888
      targetPort: metrics
