apiVersion: v2
name: otel-collector-agent
description: >-
  OpenTelemetry Collector agent (per-node DaemonSet) for the Blue Economy
  Platform observability foundation (phase-7 OTel wave, OTEL_DESIGN.md
  section 1): OTLP ingestion (gRPC :4317 / HTTP :4318) from every workload,
  infra receivers for the middleware tier (kafkametricsreceiver for broker
  and consumer-group lag, postgresqlreceiver per database, redisreceiver),
  memory_limiter -> batch -> OTLP forward to the collector gateway. The
  collector image is the contrib distribution (the infra receivers live in
  contrib); version aligned to the pinned upstream review
  (components/upstream-components.lock.yaml: opentelemetry-collector
  app_version 0.158.0). Telemetry never breaks the business path:
  exporters are async/batched and collector-unavailable means
  drop-with-metric, never request failure (the one sanctioned fail-open,
  documented in OTEL_DESIGN.md).
type: application
version: 0.1.0
appVersion: "0.158.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - opentelemetry
  - observability
  - collector
  - blue-economy
annotations:
  blueeconomy.platform/criticality: "observability-foundation"
  blueeconomy.platform/upstream: "https://github.com/open-telemetry/opentelemetry-collector-contrib (image otel/opentelemetry-collector-contrib)"
  blueeconomy.platform/upstream-policy: "Pin verified upstream image digests; do not deploy unreviewed defaults"
