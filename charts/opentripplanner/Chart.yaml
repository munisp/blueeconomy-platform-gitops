apiVersion: v2
name: opentripplanner
description: >-
  OpenTripPlanner 2 (OTP2) multimodal trip-planning engine for the Blue
  Economy Platform citizen services layer (CITIZEN_SERVICES_ADVISORY.md
  section 5: door-to-door journey planning across ferry + BRT + rail +
  walking; jetties as interchanges; proto-MaaS open-data stance). Two
  render-gated modes: mode=build renders a graph-build Job that consumes
  the geo-service static GTFS feed (plus optional OSM PBF) into a shared
  graph volume; mode=serve loads a prebuilt graph from that volume or from
  an approved graph URL. GTFS-RT updaters (VehiclePositions / TripUpdates
  / Alerts) poll the geo-service feed endpoints. Fail-closed: digest-pinned
  images, no :latest, ExternalSecrets-only credentials, resources required,
  NetworkPolicy (ingress from the APISIX edge only, egress to geo-service
  and DNS only), PDB/HPA, ServiceMonitor on the OTP2 ActuatorAPI
  (Micrometer/Prometheus), and an opt-in OpenTelemetry javaagent
  (default OFF, render-refused without its OTLP endpoint).
type: application
version: 0.1.0
appVersion: "2.7.0"
kubeVersion: ">=1.28.0-0"
keywords:
  - opentripplanner
  - otp2
  - multimodal
  - gtfs
  - gtfs-rt
  - citizen-services
  - blue-economy
annotations:
  blueeconomy.platform/criticality: "citizen-services"
  blueeconomy.platform/upstream: "https://github.com/opentripplanner/OpenTripPlanner (image opentripplanner/opentripplanner, LGPL-3.0)"
  blueeconomy.platform/upstream-policy: "Pin verified upstream image digests; do not deploy unreviewed defaults"
