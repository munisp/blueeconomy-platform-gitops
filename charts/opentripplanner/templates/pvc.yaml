{{- if and (not .Values.persistence.existingClaim) (or (eq .Values.mode "build") (and (eq .Values.mode "serve") (not .Values.graph.url))) -}}
# Graph volume (graph.obj + downloaded build inputs), shared between the
# graph-build Job and the serve pods.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opentripplanner.pvcName" . }}
  labels:
    {{- include "opentripplanner.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
