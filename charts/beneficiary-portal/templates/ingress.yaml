{{- if .Values.ingress.enabled }}
# TLS-only edge ingress on the approved APISIX class. The host must match
# the OIDC redirect-URI allowlist registered on the beneficiary-portal
# public client (charts/keycloak-realms publicClientRedirects).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "beneficiary-portal.fullname" . }}
  labels:
    {{- include "beneficiary-portal.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "beneficiary-portal.fullname" . }}
                port:
                  name: http
{{- end }}
