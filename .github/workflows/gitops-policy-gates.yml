name: GitOps Policy Gates

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'kubernetes/**'
      - 'components/**'
      - 'policies/**'
      - 'scripts/**'
      - 'gitops/**'
      - 'ci/**'
      - '.github/workflows/gitops-policy-gates.yml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'kubernetes/**'
      - 'components/**'
      - 'policies/**'
      - 'scripts/**'
      - 'gitops/**'
      - 'ci/**'
      - '.github/workflows/gitops-policy-gates.yml'

permissions:
  contents: read

concurrency:
  group: gitops-policy-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: GitOps Policy Gates / Validate manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify required local toolchain
        run: |
          set -euo pipefail
          command -v helm
          helm version --short
          command -v grep
          command -v sha256sum
          python3 -c 'import yaml'

      - name: Reject secret-like material and whitespace errors
        run: |
          set -euo pipefail
          git diff --check
          if git grep -nE -- ': (-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|gh[pousr]_[A-Za-z0-9_]+|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,})' -- \
            charts kubernetes components policies scripts; then
            echo 'secret-like material detected in GitOps source' >&2
            exit 1
          fi

      - name: Validate manifests, source locks and fail-closed chart defaults
        env:
          HELM_KUBE_VERSION: 1.28.0
        run: |
          set -euo pipefail
          ./scripts/validate-manifests.sh

      - name: Validate APISIX route inventory (plugins, upstreams, URIs, TLS)
        env:
          HELM_KUBE_VERSION: 1.28.0
        run: |
          set -euo pipefail
          ./scripts/validate-apisix-routes.sh

      - name: Confirm no deployment path exists in the gate
        run: |
          set -euo pipefail
          ! grep -RInE --exclude='gitops-policy-gates.yml' \
            '(^|[[:space:]])(kubectl|helm)[[:space:]]+(apply|upgrade|install|rollback)|argocd[[:space:]]+(app[[:space:]]+sync|sync)|flux[[:space:]]+reconcile' \
            .github/workflows
