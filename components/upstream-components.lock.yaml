version: 1
retrieved_at: "2026-08-12T15:16:00Z"
policy:
  open_source_first: true
  deployment_status: source_locked_not_deployed
  non_fabrication_rule: >-
    A locked upstream source is not evidence of a deployed, configured, healthy,
    integrated or production-ready component. Environment-specific manifests and
    secret references are created only after the authorised hybrid target is supplied.
components:
  - name: apache-apisix
    purpose: API edge, route policy, authentication and rate controls
    upstream:
      type: helm_chart
      repository: https://apache.github.io/apisix-helm-chart
      chart: apisix/apisix
      chart_version: 2.16.0
      app_version: 3.17.0
      artifact_sha256: 9998326a7f72d41b3475aabfbcab0522b88e62698cb150ac28eea2245832c6c3
      official_documentation: https://apisix.apache.org/docs/helm-chart/apisix/
    deployment_gate:
      - Approved ingress and public/private exposure model.
      - Authorised Keycloak/OIDC and mTLS configuration.
      - Real upstream-service and route contract inventory.
      - Approved TLS certificate and secret-management references.
  - name: opensearch
    purpose: Search and segregated security/audit/operations analytics indexes
    upstream:
      type: helm_chart
      repository: https://opensearch-project.github.io/helm-charts/
      chart: opensearch/opensearch
      chart_version: 3.8.0
      app_version: 3.8.0
      artifact_sha256: cad6c77d04ec2389be6f61b5422ce61e7264eb7145e42b4c78dbc00e9d7dbe4d
      official_documentation: https://docs.opensearch.org/latest/install-and-configure/install-opensearch/helm/
    deployment_gate:
      - Approved storage class, encryption, backup and retention model.
      - Real index tenancy, access-control and audit requirements.
      - Resource, shard and availability-zone sizing from measured telemetry volume.
  - name: opencti
    purpose: Curated cyber-threat intelligence and enrichment context
    upstream:
      type: helm_chart
      repository: https://devops-ia.github.io/helm-opencti/
      chart: opencti/opencti
      chart_version: 2.4.12
      app_version: 7.260807.0
      artifact_sha256: 107b6f7703ee687903b97d45a1e41ca75dab6feef29f87ded31ad8b60f9e77eb
      official_documentation: https://docs.opencti.io/latest/deployment/installation/
      maintenance_note: >-
        The OpenCTI documentation references this Helm chart. It is a community-maintained
        upstream and must pass source, licence, vulnerability and operational review before
        any production approval.
    deployment_gate:
      - Approved source/feed licences, sharing markings, confidence/expiry policy and data retention.
      - Approved WebSocket/ingress/base-path configuration.
      - Real dependency, secrets and connector configuration supplied through secret management.
  - name: keycloak-operator
    purpose: Kubernetes-native lifecycle management for Keycloak identity service
    upstream:
      type: kustomize_manifest
      repository: https://github.com/keycloak/keycloak-k8s-resources
      ref: 103ea5041e4ff31b4123a6c31032c4fd3c07dc12
      version_tag: 26.7.1
      path: kubernetes
      official_documentation: https://www.keycloak.org/operator/installation
    deployment_gate:
      - Ministry decision on OLM versus kubectl/Kustomize operator installation.
      - Approved Keycloak database, hostname, TLS, bootstrap and federation design.
      - Actual realm/client/role configuration and integration test tenant.
  - name: wazuh-kubernetes
    purpose: Endpoint/workload/configuration telemetry and detection platform
    upstream:
      type: kustomize_manifest
      repository: https://github.com/wazuh/wazuh-kubernetes
      ref: 14f78b70ba553db2e3c0b3d1c013bde4d306a911
      version_tag: v4.14.7
      path: envs/local-env
      official_documentation: https://documentation.wazuh.com/current/deployment-options/deploying-with-kubernetes/kubernetes-deployment.html
    deployment_gate:
      - Approved CA/certificate design and password/secret-management references.
      - Approved storage class and capacity policy.
      - Real agent enrolment, OpenSearch security tenancy, Keycloak SSO and SOC runbook validation.
  - name: strimzi-kafka-operator
    purpose: Kubernetes-native Apache Kafka lifecycle and event-stream operations
    upstream:
      type: helm_chart
      repository: https://strimzi.io/charts/
      chart: strimzi/strimzi-kafka-operator
      chart_version: 1.1.0
      app_version: 1.1.0
      artifact_sha256: d80c9500049594926d2258345ffd04556abef0cbef9aa3f9ae8be25d96635c74
      official_documentation: https://strimzi.io/documentation/
    deployment_gate:
      - Approved Kafka cluster sizing, replication, rack/failure-domain and storage-class design.
      - Approved topic, ACL, retention, encryption and schema/contract lifecycle policy.
      - Real producer/consumer identities and non-production evidence of end-to-end event delivery.
  - name: temporal
    purpose: Durable workflow orchestration for long-running maritime and safety processes
    upstream:
      type: helm_chart
      repository: https://go.temporal.io/helm-charts
      chart: temporal/temporal
      chart_version: 1.6.0
      app_version: 1.31.2
      artifact_sha256: 4ea557365bca72e635ae82fc4a93d586df238946e5d5a19eb32a8a24748449f9
      official_documentation: https://github.com/temporalio/helm-charts
    deployment_gate:
      - Approved persistence datastore, backup/recovery, retention, namespace and worker-identity design.
      - Real workflow namespace and API endpoint supplied by the authorised hybrid environment.
      - Failure, retry, compensation and recovery tests executed against genuine non-production dependencies.
  - name: dapr
    purpose: Portable service-to-service invocation, state, pub/sub and secret-integration building blocks
    upstream:
      type: helm_chart
      repository: https://dapr.github.io/helm-charts/
      chart: dapr/dapr
      chart_version: 1.18.2
      app_version: 1.18.2
      artifact_sha256: 9f587be1bb06bf5bd73effc6810f662aa9255f869b0e060c7966484a964d7057
      official_documentation: https://docs.dapr.io/operations/hosting/kubernetes/kubernetes-deploy/
    deployment_gate:
      - Approved sidecar/resource policy and service-account/workload identity model.
      - Real component configuration for Kafka, PostgreSQL, Redis/object state or secret store as applicable.
      - mTLS, resiliency and observability verification against the authorised cluster.
  - name: cloudnative-pg
    purpose: PostgreSQL high-availability lifecycle, backup and recovery operator
    upstream:
      type: helm_chart
      repository: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg/cloudnative-pg
      chart_version: 0.29.0
      app_version: 1.30.0
      artifact_sha256: 668e065ff53508d58238788fd35b355a925060843629a951df0e6a9362e6d32f
      official_documentation: https://cloudnative-pg.io/documentation/current/
    deployment_gate:
      - Approved database encryption, storage class, backup object store, recovery objective and access model.
      - Measured workload sizing and real restore verification in the authorised non-production target.
  - name: prometheus
    purpose: Metrics collection, alerting rules and per-workstream ServiceMonitor/PodMonitor scraping
    upstream:
      type: helm_chart
      repository: https://prometheus-community.github.io/helm-charts
      chart: prometheus-community/prometheus
      chart_version: 29.27.0
      app_version: 3.14.0
      # SHA-256 verified against the release tarball published by the upstream index.
      artifact_sha256: 1a4694c2f0a6a778d634c13e5434079fcfb3abacf33ae0f95814f84098602edd
      official_documentation: https://prometheus.io/docs/prometheus/latest/installation/
    deployment_gate:
      - Approved retention, storage class, remote-write and sovereign data-residency model.
      - Approved scrape/alert rule inventory and per-workstream ServiceMonitor label contract.
      - Real Thanos/object-storage or equivalent long-term-retention design for audit evidence.
  - name: opentelemetry-collector
    purpose: Vendor-neutral trace/metric/log collection and enrichment for all workstreams
    upstream:
      type: helm_chart
      repository: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: open-telemetry/opentelemetry-collector
      chart_version: 0.171.0
      app_version: 0.158.0
      # SHA-256 verified against the release tarball published by the upstream index.
      artifact_sha256: 5526010c00b6319ced10dd9e711149b10d5539dfa1e23ee22546648f7f702352
      official_documentation: https://opentelemetry.io/docs/platforms/kubernetes/helm/collector/
    deployment_gate:
      - Approved OTLP ingestion endpoints, tenant/attribute enrichment and sampling policy.
      - Approved exporter set (Prometheus remote-write, OpenSearch, Tempo-equivalent) and secret references.
      - CVFF telemetry labelled FIDUCIARY_SEGREGATED and routed only to the segregated indexes.
  - name: argo-cd
    purpose: Declarative GitOps controller reconciling this repository onto the authorised cluster
    upstream:
      type: kustomize_manifest
      repository: https://github.com/argoproj/argo-cd
      ref: e258ee23c3e52266d407572f4bcdfe7d9ed36cb5
      version_tag: v3.5.2
      path: manifests/cluster-install
      official_documentation: https://argo-cd.readthedocs.io/en/stable/operator-manual/installation/
    deployment_gate:
      - Ministry decision on controller placement (in-cluster versus dedicated management cluster).
      - Approved SSO/OIDC integration with Keycloak, RBAC policy and notification/audit routing.
      - Approved AppProject restrictions (source repos, destinations, cluster-resource allow-list).
  - name: cilium
    purpose: eBPF CNI with kube-proxy replacement, Hubble, Tetragon and XDP DDoS mitigation (charts/cilium)
    upstream:
      type: helm_chart
      repository: https://helm.cilium.io
