# CI render-gate fixture ONLY (cvff workstream variant). NOT deployable.
workstream:
  name: cvff
  appIds:
    - intent-api
    - cvff-worker
    - cvff-outbox-publisher
    - cvff-api
    - declaration-scorer

pubsub:
  kafka:
    brokers: kafka.blueeconomy-platform.svc.cluster.local:9092

state:
  hot:
    redisHost: redis-master.blueeconomy-platform.svc.cluster.local:6379
    passwordSecretKeyRef:
      name: dapr-cvff-components
      key: redis-password
  durable:
    connectionStringSecretKeyRef:
      name: dapr-cvff-components
      key: postgres-connection-string

secretStores:
  azureKeyVault:
    vaultName: blueeco-usgov-kv

externalSecrets:
  storeRef:
    name: azure-keyvault-usgov
    kind: ClusterSecretStore
  keys:
    redis-password: cvff/render-fixture/redis-password
    postgres-connection-string: cvff/render-fixture/postgres-connection-string
