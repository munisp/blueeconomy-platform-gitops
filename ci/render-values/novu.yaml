# CI render-gate fixture ONLY. NOT deployable: synthetic digest and
# illustrative references. Real values live in the authorised environment
# repo.
profile: prod

image:
  repository: novuhq/novu
  digest: sha256:4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d

env:
  API_ROOT_URL: https://notifications.blueeconomy.example.gov.ng

dataStores:
  mongodb:
    host: mongodb.blueeconomy-platform.svc.cluster.local
    port: 27017
  redis:
    host: redis.blueeconomy-platform.svc.cluster.local
    port: 6379

externalSecrets:
  storeRef:
    name: azure-keyvault-usgov
    kind: ClusterSecretStore
  keys:
    NOVU_MONGO_URL: observability/render-fixture/novu-mongo-url
    NOVU_REDIS_PASSWORD: observability/render-fixture/novu-redis-password
    JWT_SECRET: observability/render-fixture/novu-jwt-secret
    STORE_ENCRYPTION_KEY: observability/render-fixture/novu-store-encryption-key
    NOVU_API_KEY: observability/render-fixture/novu-api-key

networkPolicy:
  allowedIngressNamespaces:
    - blueeconomy-security
  mongodbNamespace: blueeconomy-platform
  redisNamespace: blueeconomy-platform
