# CI render-gate fixture ONLY (seafarer workstream variant). NOT deployable.
workstream:
  name: seafarer
  appIds:
    - credential-verification-api
    - seafarer-credential-worker

pubsub:
  kafka:
    brokers: kafka.blueeconomy-platform.svc.cluster.local:9092

state:
  hot:
    redisHost: redis-master.blueeconomy-platform.svc.cluster.local:6379
    passwordSecretKeyRef:
      name: dapr-seafarer-components
      key: redis-password
  durable:
    connectionStringSecretKeyRef:
      name: dapr-seafarer-components
      key: postgres-connection-string

secretStores:
  azureKeyVault:
    vaultName: blueeco-usgov-kv

externalSecrets:
  storeRef:
    name: azure-keyvault-usgov
    kind: ClusterSecretStore
  keys:
    redis-password: seafarer/render-fixture/redis-password
    postgres-connection-string: seafarer/render-fixture/postgres-connection-string

# Dapr sidecar native OTel tracing (collector agent endpoint).
tracing:
  enabled: true
  samplingRate: "1"
  otelEndpointAddress: otel-collector-agent-otel-collector-agent.blueeconomy-observability.svc.cluster.local:4317
  otelIsSecure: false
