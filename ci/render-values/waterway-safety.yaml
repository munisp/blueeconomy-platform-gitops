# CI render-gate fixture ONLY. NOT deployable: synthetic digest and
# illustrative references. Real values live in the authorised environment
# repo.
profile: prod

image:
  repository: registry.blueeconomy.example.gov.ng/blueeconomy/waterway-safety
  digest: sha256:5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f

env:
  GATEWAY_ID: gw-apapa-01
  VESSEL_DEVICE_ID: shoreside-relay-apapa
  UPLINK_TRANSPORT: kafka
  UPLINK_ENDPOINT: kafka.blueeconomy-platform.svc.cluster.local:9092
  DATA_CLASSIFICATION: internal

externalSecrets:
  storeRef:
    name: azure-keyvault-usgov
    kind: ClusterSecretStore
  keys:
    PROVENANCE_SIGNING_KEY: waterway-safety/render-fixture/provenance-signing-key

networkPolicy:
  allowedIngressNamespaces:
    - blueeconomy-ferries
  uplinkNamespace: blueeconomy-platform

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
