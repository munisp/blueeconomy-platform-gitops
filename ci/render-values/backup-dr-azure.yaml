# CI render-gate fixture ONLY. NOT deployable: synthetic digests and
# illustrative endpoints. Real values live in the authorised environment repo.
# Provider family: azure (Azure Blob/ADLS backup storage — a fully-supported
# landing-zone option, incl. Azure Government; not a platform requirement).
upstream:
  chartName: velero
  chartVersion: 8.1.0
  repository: https://vmware-tanzu.github.io/helm-charts

backup:
  immutabilityDays: 30
  consistency:
    regionalDRImmutabilityDays: 30

storage:
  provider: azure
  bucket: blueeconomy-backups
  prefix: blueeconomy
  azure:
    storageAccount: blueeconomybackups
    resourceGroup: blueeconomy-dr
  credentialsSecretRef:
    name: backup-storage-credentials

velero:
  schedules:
    - name: daily-platform-backup
      schedule: "0 2 * * *"
      ttlDays: 45
      includedNamespaces:
        - blueeconomy-ports
        - blueeconomy-ferries
        - blueeconomy-cvff
        - blueeconomy-seafarer
        - blueeconomy-fisheries
        - blueeconomy-isr
        - blueeconomy-security
        - blueeconomy-platform
        - blueeco-tigerbeetle-prod

walG:
  image:
    repository: blueeconomy.azurecr.us/blueeconomy/wal-g
    digest: sha256:1b2c3d4e5f60718293a4b5c6d7e8f90123456789abcdef018c1f4b2a9d6e5f0a
  baseBackupSchedule: "30 1 * * *"
  clusters:
    - name: cvff-postgres
      namespace: blueeconomy-platform
      service: postgres-rw.blueeconomy-platform.svc.cluster.local
    - name: keycloak-postgres
      namespace: blueeconomy-security
      service: keycloak-postgres-rw.blueeconomy-security.svc.cluster.local

restoreTest:
  schedule: "0 4 * * 0"
