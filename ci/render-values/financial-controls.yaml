# CI render-gate fixture ONLY. NOT deployable: synthetic digests and
# illustrative endpoints. Real values live in the authorised environment repo.
externalSecrets:
  storeRef:
    name: azure-keyvault-usgov
    kind: ClusterSecretStore
  keys:
    DATABASE_URL: cvff/render-fixture/database-url

components:
  intent-api:
    image:
      repository: blueeconomy.azurecr.us/blueeconomy/intent-api
      digest: sha256:97954ca15c3cf23174e3343c1f8ce09a86bfd12ec0d05495d2b1039a714f6529
  cvff-worker:
    image:
      repository: blueeconomy.azurecr.us/blueeconomy/cvff-worker
      digest: sha256:18355da5c2616a3dc431eb02a9584df4f22ca840e9b8edbc3e3472db6aada161
    env:
      TIGERBEETLE_CLUSTER_ID_HEX: "00000000000000000000000000000001"
      TIGERBEETLE_REPLICA_ADDRESSES: tigerbeetle-0.tigerbeetle-headless.blueeco-tigerbeetle-prod.svc.cluster.local:3000
      CVFF_NGN_DEBIT_ACCOUNT_ID_HEX: "00000000000000000000000000000011"
      CVFF_NGN_CREDIT_ACCOUNT_ID_HEX: "00000000000000000000000000000012"
      CVFF_USD_DEBIT_ACCOUNT_ID_HEX: "00000000000000000000000000000013"
      CVFF_USD_CREDIT_ACCOUNT_ID_HEX: "00000000000000000000000000000014"
      CVFF_NGN_LEDGER: "10"
      CVFF_USD_LEDGER: "11"
      CVFF_FEE_CODE: "100"
      CVFF_COST_CODE: "101"
      CVFF_CUSTODIAL_FEE_BPS: "50"
  outbox-publisher:
    image:
      repository: blueeconomy.azurecr.us/blueeconomy/cvff-outbox-publisher
      digest: sha256:a8d2241077d59e28c419e3297fb1725f5c7ca276048f6961af5502b0e273fadc
    env:
      KAFKA_BROKERS: kafka.blueeconomy-platform.svc.cluster.local:9092
      KAFKA_TOPIC: cvff.disbursement.v1

networkPolicy:
  allowedIngressNamespaces: ["blueeconomy-edge"]
  allowedEgress:
    - namespace: kube-system
      ports: [53]
      protocols: ["UDP", "TCP"]
    - namespace: blueeconomy-platform
      ports: [5432, 9092, 7233, 8080]
    - namespace: blueeco-tigerbeetle-prod
      ports: [3000]

monitoring:
  serviceMonitor:
    enabled: true
