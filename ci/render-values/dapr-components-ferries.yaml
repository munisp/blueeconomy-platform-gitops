# CI render-gate fixture ONLY (ferries workstream variant). NOT deployable.
# ferries scopes are restricted to the ferry-ticketing app-ids; widening is
# rejected by the chart's scope segregation gate.
workstream:
  name: ferries
  appIds:
    - ferry-api
    - ferry-worker
    - ferry-outbox-publisher

pubsub:
  kafka:
    brokers: kafka.blueeconomy-platform.svc.cluster.local:9092

state:
  hot:
    redisHost: redis-master.blueeconomy-platform.svc.cluster.local:6379
    passwordSecretKeyRef:
      name: dapr-ferries-components
      key: redis-password
  durable:
    connectionStringSecretKeyRef:
      name: dapr-ferries-components
      key: postgres-connection-string

secretStores:
  azureKeyVault:
    vaultName: blueeco-usgov-kv

externalSecrets:
  storeRef:
    name: azure-keyvault-usgov
    kind: ClusterSecretStore
  keys:
    redis-password: ferries/render-fixture/redis-password
    postgres-connection-string: ferries/render-fixture/postgres-connection-string
