# CI render-gate fixture ONLY (cloudnative-pg variant). NOT deployable:
# synthetic digests and illustrative endpoints. Real values live in the
# authorised environment repo.
image:
  variant: cloudnative-pg
  cloudnativePG:
    repository: ghcr.io/cloudnative-pg/postgis
    digest: sha256:3a4b5c6d3a4b5c6d3a4b5c6d3a4b5c6d3a4b5c6d3a4b5c6d3a4b5c6d3a4b5c6d
  postgisImage:
    repository: postgis/postgis
    digest: sha256:9f8e7d6c9f8e7d6c9f8e7d6c9f8e7d6c9f8e7d6c9f8e7d6c9f8e7d6c9f8e7d6c

cluster:
  instances: 3

storage:
  size: 100Gi
  storageClass: geo-ssd

credentialsSecretRef:
  name: geo-postgis-credentials
  usernameKey: username
  passwordKey: password

backup:
  enabled: true
  storageProvider: s3-compatible
  walGEnvConfigMapRef: backup-dr-walg-env
  baseBackupSchedule: "30 1 * * *"

networkPolicy:
  allowedClientNamespaces:
    - blueeco-geo-prod
