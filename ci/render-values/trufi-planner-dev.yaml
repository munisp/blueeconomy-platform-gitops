# CI render-gate fixture ONLY (dev profile variant). NOT deployable:
# synthetic digest and illustrative references. Dev may use http
# localhost origins/endpoints; the prod HTTPS gates still apply to the
# prod fixture.
profile: dev

image:
  repository: registry.blueeconomy.example.gov.ng/citizen/trufi-planner
  digest: sha256:5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e

replicas: 1
port: 8080

hpa:
  enabled: false

otp:
  apiBaseUrl: http://localhost:8080/otp

edge:
  routeRegistration:
    required: true
    apisixRouteRef: ferries-trufi-planner-dev
  # Mirrored in ci/render-values/otel-collector-agent-dev.yaml
  # rumAllowedOrigins (the CORS values flow).
  publicOrigin: http://localhost:8088

rum:
  enabled: true
  endpoint: http://localhost:4318/v1/traces
  serviceName: trufi-planner
  sampleRatio: 1.0

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

networkPolicy:
  apisixNamespace: blueeconomy-security
