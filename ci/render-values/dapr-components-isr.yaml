# CI render-gate fixture ONLY (isr workstream variant). NOT deployable.
# isr scopes are restricted to the maritime-intelligence app-ids; widening is
# rejected by the chart's national-security segregation gate.
workstream:
  name: isr
  appIds:
    - maritime-intelligence-api
    - isr-worker
    - isr-outbox-publisher

pubsub:
  kafka:
    brokers: kafka.blueeconomy-platform.svc.cluster.local:9092

state:
  hot:
    redisHost: redis-master.blueeconomy-platform.svc.cluster.local:6379
    passwordSecretKeyRef:
      name: dapr-isr-components
      key: redis-password
  durable:
    connectionStringSecretKeyRef:
      name: dapr-isr-components
      key: postgres-connection-string

secretStores:
  azureKeyVault:
    vaultName: blueeco-usgov-kv

externalSecrets:
  storeRef:
    name: azure-keyvault-usgov
    kind: ClusterSecretStore
  keys:
    redis-password: isr/render-fixture/redis-password
    postgres-connection-string: isr/render-fixture/postgres-connection-string
