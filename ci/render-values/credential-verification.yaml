# CI render-gate fixture ONLY. These values exist so that `helm template`
# exercises the full chart during validation. They are NOT deployable: the
# image digests are synthetic and the environment endpoints are illustrative.
# Real environment values live in the authorised environment repository.
externalSecrets:
  storeRef:
    name: azure-keyvault-usgov
    kind: ClusterSecretStore
  keys:
    BLUEECONOMY_STATUS_DATABASE_URL: seafarer/render-fixture/status-database-url
    ISSUER_ED25519_PKCS8_PEM: seafarer/render-fixture/issuer-ed25519-pkcs8-pem

components:
  credential-api:
    image:
      repository: blueeconomy.azurecr.us/blueeconomy/credential-verification-api
      digest: sha256:1a70360115ad4ea302dcae29b04f86d8bc9e523c0fb13d076e971db2ee547ed6
    env:
      BLUEECONOMY_ISSUER_DID: did:web:credentials.example.invalid
      BLUEECONOMY_STATUS_LIST_URL: https://credential-api.blueeconomy-seafarer.svc.cluster.local/v1/status-list/1
      BLUEECONOMY_TIGERBEETLE_ADDRESSES: tigerbeetle.blueeco-tigerbeetle-prod.svc.cluster.local:3000
      BLUEECONOMY_OIDC_ISSUER: https://keycloak.blueeconomy-platform.svc.cluster.local/realms/blueeconomy-seafarer
      BLUEECONOMY_OIDC_AUDIENCE: credential-verification-api
      BLUEECONOMY_OIDC_JWKS_URL: https://keycloak.blueeconomy-platform.svc.cluster.local/realms/blueeconomy-seafarer/protocol/openid-connect/certs
      BLUEECONOMY_KAFKA_BROKERS: kafka.blueeconomy-platform.svc.cluster.local:9092
  seafarer-credential-worker:
    image:
      repository: blueeconomy.azurecr.us/blueeconomy/seafarer-credential-worker
      digest: sha256:0df4b022c44ae8a20bbb78f626ec7d4808cf6a0b93edd202183adc09651b7da7
    env:
      BLUEECONOMY_TIGERBEETLE_ADDRESSES: tigerbeetle.blueeco-tigerbeetle-prod.svc.cluster.local:3000

networkPolicy:
  allowedIngressNamespaces: ["blueeconomy-edge"]
  allowedEgress:
    - namespace: kube-system
      ports: [53]
      protocols: ["UDP", "TCP"]
    - namespace: blueeconomy-platform
      ports: [5432, 9092, 7233, 8080]
    - namespace: blueeco-tigerbeetle-prod
      ports: [3000]

monitoring:
  serviceMonitor:
    enabled: true
