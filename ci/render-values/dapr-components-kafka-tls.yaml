# CI render-gate fixture ONLY (cvff workstream, Kafka TLS/SASL variant,
# gap #7). NOT deployable. Proves the render-gated TLS/SASL option renders;
# prod values set pubsub.kafka.tls.required=true.
workstream:
  name: cvff
  appIds:
    - intent-api
    - cvff-worker
    - cvff-outbox-publisher

pubsub:
  kafka:
    brokers: kafka.blueeconomy-platform.svc.cluster.local:9093
    authType: sasl
    saslPasswordSecretKeyRef:
      name: dapr-cvff-components
      key: kafka-sasl-password
    sasl:
      mechanism: scram-sha-512
    tls:
      enabled: true
      required: true
      caCertSecretRef:
        name: kafka-cluster-ca-cert
        key: ca.crt

state:
  hot:
    redisHost: redis-master.blueeconomy-platform.svc.cluster.local:6379
    passwordSecretKeyRef:
      name: dapr-cvff-components
      key: redis-password
  durable:
    connectionStringSecretKeyRef:
      name: dapr-cvff-components
      key: postgres-connection-string

secretStores:
  azureKeyVault:
    vaultName: blueeco-usgov-kv

externalSecrets:
  storeRef:
    name: azure-keyvault-usgov
    kind: ClusterSecretStore
  keys:
    redis-password: cvff/render-fixture/redis-password
    postgres-connection-string: cvff/render-fixture/postgres-connection-string
    kafka-sasl-password: cvff/render-fixture/kafka-sasl-password

# Dapr sidecar native OTel tracing (collector agent endpoint).
tracing:
  enabled: true
  samplingRate: "1"
  otelEndpointAddress: otel-collector-agent-otel-collector-agent.blueeconomy-observability.svc.cluster.local:4317
  otelIsSecure: false
