# CI render-gate fixture ONLY (dev profile variant). NOT deployable:
# synthetic digest and illustrative references. Dev may use localhost
# RUM origins; the prod wildcard refusal still applies if '*' sneaks in.
profile: dev

image:
  repository: otel/opentelemetry-collector-contrib
  digest: sha256:0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f9

gatewayEndpoint: render-gate-otel-collector-gateway.blueeconomy-observability.svc.cluster.local:4317

# Dev-profile browser RUM origins (localhost portal dev servers).
rumAllowedOrigins:
  - http://localhost:3000
  - http://localhost:4200

receivers:
  kafka:
    enabled: true
    brokers: kafka.blueeconomy-platform.svc.cluster.local:9092
  postgresql:
    enabled: true
    databases:
      - name: geo-postgis
        endpoint: postgis-rw.blueeco-geo-prod.svc.cluster.local:5432
        database: geo
        username: otel_collector_ro
        passwordSecretKey: OTEL_PG_GEO_PASSWORD
  redis:
    enabled: true
    endpoints:
      - redis.blueeconomy-platform.svc.cluster.local:6379

externalSecrets:
  storeRef:
    name: azure-keyvault-usgov
    kind: ClusterSecretStore
  keys:
    OTEL_PG_GEO_PASSWORD: observability/render-fixture/pg-geo-password

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

networkPolicy:
  allowedIngressNamespaces:
    - blueeconomy-platform
  kafkaNamespace: blueeconomy-platform
  postgresNamespaces:
    - blueeco-geo-prod
  redisNamespaces:
    - blueeconomy-platform
